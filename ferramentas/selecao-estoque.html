<!-- Estoque: selecionar vários produtos e excluir (só a gestão).
     Respeita a busca e a categoria filtradas. Antes de excluir baixa uma cópia em CSV (pode ser importada de volta em Importar produtos).
     As movimentações dos produtos excluídos ficam no histórico (aparecem como "Produto removido").
     Entra no index.html pelo ferramentas/montar.py, depois do sistema. -->
<style>
.selp-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.selp-bar label{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;cursor:pointer}
.selp-bar input,.selp-chk input{width:18px;height:18px;accent-color:var(--red);cursor:pointer}
.selp-chk{display:inline-flex;align-items:center;margin-right:8px;vertical-align:middle}
.selp-on tbody tr[data-id]{cursor:pointer}
.selp-on tbody tr.selp-marcado td{background:#FEF2F2}
@media (max-width:820px){.selp-on tbody tr.selp-marcado{outline:2px solid var(--red);outline-offset:-2px;background:#FEF2F2}}
</style>
<script>
window.DRAVEN_SELP=(function(){
  const st={on:false,ids:new Set()};
  const podeUsar=()=>typeof pode==='function'&&pode('excluir')&&S.view==='estoque'&&S.estTab!=='mov'&&S.produtos.length>0;
  const wrap=()=>document.querySelector('#main #body .tbl-wrap');
  const linhas=()=>[...(wrap()?.querySelectorAll('tbody tr[data-id]')||[])];
  const visiveis=()=>linhas().map(r=>r.dataset.id);
  function desenhar(){
    const w=wrap();let bar=document.querySelector('#main #body .selp-bar');
    if(!podeUsar()||!w){if(bar)bar.remove();if(!podeUsar()){st.on=false;st.ids.clear()}return}
    const vis=visiveis();
    for(const id of[...st.ids])if(!vis.includes(id))st.ids.delete(id);   // tira quem saiu do filtro
    if(!bar){bar=document.createElement('div');bar.className='selp-bar';w.before(bar)}
    const todos=vis.length&&vis.every(id=>st.ids.has(id));
    const html=!st.on?`<button type="button" class="btn" data-selp="on"><i class="fa-regular fa-square-check"></i> Selecionar vários</button>`
      :`<label><input type="checkbox" data-selp="todos" ${todos?'checked':''}> Todos (${vis.length})</label>
        <button type="button" class="btn danger" data-selp="excluir" ${st.ids.size?'':'disabled'}><i class="fa-solid fa-trash"></i> Apagar selecionados (${st.ids.size})</button>
        <button type="button" class="btn" data-selp="off">Cancelar</button>`;
    if(bar.dataset.h!==html){bar.innerHTML=html;bar.dataset.h=html}
    w.classList.toggle('selp-on',st.on);
    for(const r of linhas()){
      let ch=r.querySelector('.selp-chk');
      if(!st.on){if(ch)ch.remove();r.classList.remove('selp-marcado');continue}
      if(!ch){ch=document.createElement('span');ch.className='selp-chk';ch.innerHTML='<input type="checkbox" tabindex="-1" aria-label="Selecionar produto">';r.firstElementChild.prepend(ch)}
      const on=st.ids.has(r.dataset.id);ch.querySelector('input').checked=on;r.classList.toggle('selp-marcado',on);
    }
  }
  let marcado=false;const agendar=()=>{if(!marcado){marcado=true;requestAnimationFrame(()=>{marcado=false;desenhar()})}};
  new MutationObserver(agendar).observe(document.documentElement,{childList:true,subtree:true});

  const celCsv=v=>{const t=String(v??'');return/[;"\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
  const numCsv=n=>String(Number(n)||0).replace('.',',');
  async function baixarCopia(ps){
    // mesmas colunas do "Excluir todo o estoque": pode ser importada de volta em Importar produtos
    const csv=['SKU;Produto;Variacao;Categoria;Unidade;Estoque;Minimo;Custo;Preco atacado;Preco varejo;Ativo;Descricao;Imagem',
      ...ps.map(x=>[x.sku,x.nome,x.variacao,x.categoria,x.unidade,numCsv(x.estoque),numCsv(x.minimo),numCsv(x.custo),numCsv(x.precoAtacado),numCsv(x.preco),x.ativo===false?'Não':'Sim',x.descricao,x.imagem].map(celCsv).join(';'))].join('\n');
    if(S.dl)await S.dl.save({filename:`draven-produtos-apagados-${new Date().toISOString().slice(0,10)}.csv`,data:new Blob(['﻿'+csv],{type:'text/csv'})});
  }
  function excluir(){
    const ps=[...st.ids].map(id=>prod(id)).filter(Boolean);if(!ps.length)return;
    const n=ps.length,pedeTexto=n>=10,un=ps.reduce((t,p)=>t+(Number(p.estoque)||0),0);
    abrir(`Apagar ${n} produto${n===1?'':'s'}`,`
     <div class="notice warn"><b>Isto apaga ${n} produto${n===1?'':'s'} do estoque</b>${n<=6?': '+ps.map(p=>esc(prodNome(p))).join(', '):''}${un?` (${n0.format(un)} unidade${un===1?'':'s'} em estoque)`:''}. Não tem como desfazer pelo sistema. As movimentações, pedidos e lotes antigos continuam, mostrando "Produto removido".</div>
     <label class="chk"><input type="checkbox" name="copia" checked> Baixar uma cópia antes (planilha que pode ser importada de volta em Importar produtos)</label>
     ${pedeTexto?'<label class="f">Para confirmar, digite <b>EXCLUIR</b><input class="inp" id="selp-conf" name="conf" autocomplete="off" autocapitalize="characters"></label>':''}
     <p class="err" id="v-err" hidden></p>`,
    async fd=>{
      if(pedeTexto&&String(fd.get('conf')||'').trim().toUpperCase()!=='EXCLUIR'){erro('#v-err','Digite EXCLUIR para confirmar.');return false}
      const btn=document.querySelector('#dlgForm button[type=submit]');
      if(fd.get('copia')){btn.textContent='Baixando a cópia…';try{await baixarCopia(ps)}catch(e){if(!confirm('Não foi possível baixar a cópia. Apagar mesmo assim?'))return false}}
      let k=0;
      for(const p of ps){try{await S.db.doc('produtos/'+p.id).delete();k++}catch(e){}if(k%20===0)btn.textContent=`Apagando ${k}/${n}…`}
      st.on=false;st.ids.clear();
      toast(`${k} produto${k===1?'':'s'} apagado${k===1?'':'s'}`);return true;
    },{submitLabel:`Apagar ${n}`});
    const b=document.querySelector('#dlgForm button[type=submit]');if(b)b.classList.add('danger');
  }

  // cliques: barra e, no modo seleção, a linha marca/desmarca em vez de abrir a ficha (Editar/Ajustar ficam para depois)
  document.addEventListener('click',e=>{
    const b=e.target.closest&&e.target.closest('[data-selp]');
    if(b&&b.closest('.selp-bar')){
      if(b.dataset.selp==='todos'){const vis=visiveis();if(b.checked)vis.forEach(id=>st.ids.add(id));else st.ids.clear();desenhar();return}
      e.preventDefault();e.stopPropagation();
      if(b.dataset.selp==='on'){st.on=true;st.ids.clear()}else if(b.dataset.selp==='off'){st.on=false;st.ids.clear()}else if(b.dataset.selp==='excluir')excluir();
      desenhar();return;
    }
    if(!st.on)return;
    const r=e.target.closest&&e.target.closest('#main #body .tbl-wrap tbody tr[data-id]');if(!r)return;
    if(!e.target.matches('.selp-chk input'))e.preventDefault();   // o próprio quadradinho marca sozinho
    e.stopPropagation();
    const id=r.dataset.id;if(st.ids.has(id))st.ids.delete(id);else st.ids.add(id);desenhar();
  },true);
  // Esc sai do modo seleção
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.on&&!document.querySelector('#dlg[open]')){st.on=false;st.ids.clear();desenhar()}});
  return{estado:st,desenhar};
})();
</script>
