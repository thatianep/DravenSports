<!-- Produtos: preço de atacado e importação de produtos (catálogo Draven 2026 ou planilha CSV).
     Entra no index.html pelo ferramentas/montar.py, depois do sistema (usa S, salvar, abrir… do sistema). -->
<style>.tbl-wrap td.mono{white-space:nowrap}</style>
<script>
window.DRAVEN_PROD=(function(){
  const ALIAS={nome:['nome','produto','descricao','item'],variacao:['variacao','cor','cores','modelo'],sku:['sku','codigo','art','artigo','referencia','ref'],
    categoria:['categoria','linha','grupo'],unidade:['unidade','un','und'],precoAtacado:['preco atacado','atacado','valor atacado'],preco:['preco varejo','varejo','preco','valor','preco de venda'],
    custo:['custo','custo unitario'],estoque:['estoque','quantidade','qtd','saldo'],minimo:['minimo','estoque minimo'],ativo:['ativo','disponivel','situacao'],obs:['observacao','obs']};
  const chave=s=>norm(s).replace(/[^a-z0-9]+/g,' ').trim();
  const numBR=v=>{const t=String(v??'').replace(/[^\d,.-]/g,'');if(!t)return 0;const n=Number(t.includes(',')?t.replace(/\./g,'').replace(',','.'):t);return isFinite(n)?n:0};
  const sim=v=>!/^(nao|não|n|0|false|inativo|indisponivel|indisponível)$/i.test(String(v??'').trim()||'sim');

  function lerCsv(txt){
    const linhas=String(txt||'').replace(/^﻿/,'').replace(/\r/g,'').split('\n').filter(l=>l.trim());
    if(linhas.length<2)return{erro:'Cole o cabeçalho e pelo menos uma linha de produto.'};
    const sep=linhas[0].includes('\t')?'\t':(linhas[0].split(';').length>linhas[0].split(',').length?';':',');
    const parse=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===sep&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(x=>x.trim())};
    const cab=parse(linhas[0]).map(chave),map={};
    // primeiro os nomes de coluna mais específicos (ex.: "preço atacado" antes de "preço")
    const ordem=['precoAtacado','preco','custo','minimo','estoque','sku','variacao','categoria','unidade','ativo','obs','nome'];
    for(const k of ordem){const i=cab.findIndex((h,ix)=>!Object.values(map).includes(ix)&&ALIAS[k].some(a=>h===chave(a)||h.startsWith(chave(a)+' ')));if(i>=0)map[k]=i}
    if(map.nome==null)return{erro:'Não encontrei a coluna de nome do produto ("Nome" ou "Produto").'};
    const rows=linhas.slice(1).map(parse).map(r=>{const o={};for(const[k,i]of Object.entries(map))o[k]=r[i]??'';return o}).filter(o=>String(o.nome).trim());
    return{rows,cols:Object.keys(map)};
  }
  function categoria(c){const n=chave(c);return CATS.find(x=>chave(x)===n)||(c?'Outro':'Outro')}

  let IMPP=null;
  function preparar(rows){
    const porSku=new Map(S.produtos.filter(p=>p.sku).map(p=>[chave(p.sku),p]));
    const porNome=new Map(S.produtos.map(p=>[chave(p.nome+' '+(p.variacao||'')),p]));
    const novos=[],atualiza=[],iguais=[],ajustes=[];
    for(const r of rows){
      const d={nome:String(r.nome).trim(),variacao:String(r.variacao||'').trim(),sku:String(r.sku||'').trim().toUpperCase(),categoria:categoria(r.categoria),unidade:String(r.unidade||'un').trim()||'un',
        preco:numBR(r.preco),precoAtacado:numBR(r.precoAtacado),ativo:r.ativo==null||r.ativo===''?true:sim(r.ativo),obs:String(r.obs||'').trim()};
      if(r.custo!=null&&r.custo!==''&&numBR(r.custo)>0)d.custo=numBR(r.custo);
      if(r.minimo!=null&&r.minimo!==''&&numBR(r.minimo)>0)d.minimo=numBR(r.minimo);
      const ini=r.estoque!=null&&r.estoque!==''?numBR(r.estoque):0;
      const p=(d.sku&&porSku.get(chave(d.sku)))||porNome.get(chave(d.nome+' '+d.variacao));
      if(!p){novos.push({d,ini});continue}
      // quantidade da planilha: vira ajuste de estoque (diferença para o saldo atual)
      if(r.estoque!=null&&r.estoque!==''){const atual=Number(p.estoque)||0,delta=ini-atual;if(delta)ajustes.push({p,atual,alvo:ini,delta})}
      // só compara o que a planilha traz: coluna ausente (ou vazia) não muda nada no produto
      const tem=k=>k in r&&String(r[k]).trim()!=='';
      const muda={};for(const k of['nome','variacao','sku','categoria','unidade','preco','precoAtacado','ativo','custo','minimo'])if(tem(k)&&k in d&&d[k]!==''&&d[k]!==p[k])muda[k]=d[k];
      if(d.obs&&d.obs!==p.obs)muda.obs=d.obs;
      Object.keys(muda).length?atualiza.push({p,muda}):iguais.push(p);
    }
    return{novos,atualiza,iguais,ajustes};
  }
  function previa(txt){
    const box=document.getElementById('ip-prev');if(!box)return;
    const r=lerCsv(txt);
    if(r.erro){IMPP=null;box.innerHTML=String(txt||'').trim()?`<p class="err">${esc(r.erro)}</p>`:'';return}
    const p=preparar(r.rows);IMPP=p;
    const temEstoque=r.cols.includes('estoque'),chk=document.getElementById('ip-est');
    if(chk){chk.closest('label').hidden=!temEstoque||!p.ajustes.length}
    const usarAj=chk&&chk.checked&&temEstoque;
    const inat=p.novos.filter(x=>!x.d.ativo).length;
    box.innerHTML=`<div class="notice"><b>${p.novos.length}</b> produto${p.novos.length===1?'':'s'} novo${p.novos.length===1?'':'s'}${inat?` (${inat} marcado${inat===1?'':'s'} como indisponível)`:''}${p.atualiza.length?` · <b>${p.atualiza.length}</b> já cadastrado${p.atualiza.length===1?'':'s'} com preço ou dado atualizado`:''}${p.iguais.length?` · ${p.iguais.length} já ${p.iguais.length===1?'está igual':'estão iguais'}`:''}.${p.ajustes.length?(usarAj?` · <b>${p.ajustes.length}</b> com estoque ajustado para a quantidade da planilha (${p.ajustes.reduce((a,x)=>a+x.delta,0)>=0?'+':''}${p.ajustes.reduce((a,x)=>a+x.delta,0)} unidades no total)`:` · estoque dos já cadastrados não muda`):''}</div>
    ${usarAj&&p.ajustes.length?`<div class="tbl-wrap" style="max-height:220px;overflow:auto"><table style="min-width:560px"><thead><tr><th>SKU</th><th>Produto</th><th class="num">Hoje</th><th class="num">Planilha</th><th class="num">Ajuste</th></tr></thead><tbody>${p.ajustes.map(a=>`<tr><td class="mono">${esc(a.p.sku||'—')}</td><td>${esc(a.p.nome)}${a.p.variacao?`<div class="ro">${esc(a.p.variacao)}</div>`:''}</td><td class="num">${a.atual}</td><td class="num">${a.alvo}</td><td class="num"><b class="${a.delta>0?'ok':'bad'}">${a.delta>0?'+':''}${a.delta}</b></td></tr>`).join('')}</tbody></table></div>`:''}
    ${p.novos.length||p.atualiza.length?`<div class="tbl-wrap" style="max-height:280px;overflow:auto"><table style="min-width:640px"><thead><tr><th>SKU</th><th>Produto</th><th>Categoria</th><th class="num">Atacado</th><th class="num">Varejo</th><th>Situação</th></tr></thead><tbody>
    ${[...p.novos.map(x=>[x.d,'Novo'+(x.d.ativo?'':' · indisponível')]),...p.atualiza.map(x=>[{...x.p,...x.muda},'Atualiza: '+Object.keys(x.muda).map(k=>({preco:'varejo',precoAtacado:'atacado'}[k]||k)).join(', ')])].slice(0,80).map(([d,s])=>`<tr><td class="mono">${esc(d.sku||'—')}</td><td>${esc(d.nome)}${d.variacao?`<div class="ro">${esc(d.variacao)}</div>`:''}</td><td>${esc(d.categoria)}</td><td class="num">${d.precoAtacado?money(d.precoAtacado):'—'}</td><td class="num">${d.preco?money(d.preco):(d.obs||'—')}</td><td>${esc(s)}</td></tr>`).join('')}
    </tbody></table></div>`:''}`;
  }
  function formImportar(){
    IMPP=null;
    abrir('Importar produtos',`
     <p class="sub" style="margin:0">Carregue o <b>catálogo Draven 2026</b> (60 itens: Angry, The Mist preta e vermelha, Shark, The Eagle, treino, bolsas e luvas de goleiro, com preço de atacado e varejo) ou uma planilha CSV sua. Produtos com o mesmo SKU (Art.) não são duplicados: só têm preço e dados atualizados. Se a planilha tiver a coluna <b>Estoque</b>, dá para atualizar o estoque de cada produto para a quantidade dela.</p>
     <div class="tools"><button type="button" class="btn pri" id="ip-cat"><i class="fa-solid fa-book-open"></i> Usar o catálogo Draven 2026</button></div>
     <label class="f">Ou arquivo CSV<input class="inp" id="ip-arq" type="file" accept=".csv,.txt,text/csv"></label>
     <label class="f">Ou cole aqui<textarea class="inp mono" id="ip-txt" rows="5" placeholder="Nome;Variação;SKU;Categoria;Unidade;Preço atacado;Preço varejo;Estoque"></textarea></label>
     <label class="chk" hidden><input type="checkbox" id="ip-est" name="ajustarEstoque" checked> Atualizar o estoque com as quantidades da planilha (lança um ajuste para cada produto)</label>
     <div id="ip-prev"></div><p class="err" id="v-err" hidden></p>`,
    async fd=>{
      const aj=fd.get('ajustarEstoque')&&!document.getElementById('ip-est').closest('label').hidden?IMPP&&IMPP.ajustes||[]:[];
      if(!IMPP||(!IMPP.novos.length&&!IMPP.atualiza.length&&!aj.length)){erro('#v-err','Nada novo para importar: produtos, preços e estoque já estão iguais à planilha.');return false}
      const btn=document.querySelector('#dlgForm button[type=submit]'),agora=Date.now(),total=IMPP.novos.length+IMPP.atualiza.length+aj.length;let n=0;
      for(const{d,ini}of IMPP.novos){
        const dados={...d,minimo:d.minimo||0,estoque:0,criadoEm:agora,atualizadoEm:agora,criadoPor:S.myId,origem:'Importação de produtos'};
        if(!dados.obs)delete dados.obs;
        const id=await salvar('produtos',null,dados);
        if(ini){S.produtos.push({id,...dados});try{await moverEstoque(id,ini,'inicial','Importação','')}catch(e){}}
        n++;if(n%10===0)btn.textContent=`Importando ${n}/${total}…`;
      }
      for(const{p,muda}of IMPP.atualiza){await salvar('produtos',p.id,{...muda,atualizadoEm:agora});n++;if(n%10===0)btn.textContent=`Importando ${n}/${total}…`}
      for(const a of aj){const atual=Number((prod(a.p.id)||a.p).estoque)||0,delta=a.alvo-atual;if(delta){try{await moverEstoque(a.p.id,delta,'ajuste','Importação de planilha','')}catch(e){}}n++;if(n%10===0)btn.textContent=`Importando ${n}/${total}…`}
      toast(`${aj.length?aj.length+' estoque'+(aj.length===1?'':'s')+' ajustado'+(aj.length===1?'':'s')+' · ':''}${IMPP.novos.length} produto${IMPP.novos.length===1?'':'s'} cadastrado${IMPP.novos.length===1?'':'s'}${IMPP.atualiza.length?` · ${IMPP.atualiza.length} atualizado${IMPP.atualiza.length===1?'':'s'}`:''}`);
      return true;
    },{submitLabel:'Importar produtos'});
    const txt=document.getElementById('ip-txt');
    txt.addEventListener('input',()=>previa(txt.value));
    document.getElementById('ip-est').addEventListener('change',()=>previa(txt.value));
    document.getElementById('ip-arq').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{txt.value=fr.result;previa(fr.result)};fr.readAsText(f)});
    document.getElementById('ip-cat').addEventListener('click',async e=>{
      e.target.disabled=true;
      try{const r=await fetch('catalogo-2026.csv',{cache:'no-cache'});if(!r.ok)throw 0;txt.value=await r.text();previa(txt.value)}
      catch(x){erro('#v-err','Não consegui carregar o catálogo. Recarregue a página e tente de novo.')}
      finally{e.target.disabled=false}
    });
  }
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-a="importar-produtos"]');if(b){e.preventDefault();e.stopPropagation();formImportar()}},true);
  // ---------------- excluir todo o estoque (produtos e movimentações), só a gestão ----------------
  const celCsv=v=>{const t=String(v??'');return /[;"\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
  const numCsv=n=>String(Number(n)||0).replace('.',',');
  async function baixarCopia(produtos,movs){
    const hoje=new Date().toISOString().slice(0,10);
    const p=['SKU;Produto;Variacao;Categoria;Unidade;Estoque;Minimo;Custo;Preco atacado;Preco varejo;Ativo',
      ...produtos.map(x=>[x.sku,x.nome,x.variacao,x.categoria,x.unidade,numCsv(x.estoque),numCsv(x.minimo),numCsv(x.custo),numCsv(x.precoAtacado),numCsv(x.preco),x.ativo===false?'Não':'Sim'].map(celCsv).join(';'))].join('\n');
    const nomeP=id=>{const x=produtos.find(y=>y.id===id);return x?`${x.sku||''} ${x.nome}${x.variacao?' · '+x.variacao:''}`.trim():id};
    const m=['Data;Produto;Tipo;Quantidade;Saldo;Origem;Referencia',
      ...movs.sort((a,b)=>(a.em||0)-(b.em||0)).map(x=>[x.em?new Date(x.em).toLocaleString('pt-BR'):'',nomeP(x.produtoId),x.tipo,numCsv(x.delta),numCsv(x.saldo),x.origem,x.ref].map(celCsv).join(';'))].join('\n');
    const salvarArq=async(nome,txt)=>{const blob=new Blob(['﻿'+txt],{type:'text/csv'});if(S.dl)await S.dl.save({filename:nome,data:blob})};
    await salvarArq(`draven-estoque-copia-${hoje}.csv`,p);
    if(movs.length)await salvarArq(`draven-movimentacoes-copia-${hoje}.csv`,m);
  }
  function formExcluirTudo(){
    if(!pode('excluir')){toast('Só a gestão pode excluir o estoque.');return}
    const n=S.produtos.length;
    abrir('Excluir todo o estoque',`
     <div class="notice warn"><b>Isto apaga ${n} produto${n===1?'':'s'} e todo o histórico de movimentações de estoque.</b> Não tem como desfazer pelo sistema. Pedidos e lotes antigos continuam, mas os itens deles passam a aparecer como "Produto removido".</div>
     <label class="chk"><input type="checkbox" name="copia" checked> Baixar uma cópia antes (planilhas de produtos e de movimentações)</label>
     <label class="f">Para confirmar, digite <b>EXCLUIR</b><input class="inp" id="ex-conf" name="conf" autocomplete="off" autocapitalize="characters"></label>
     <p class="err" id="v-err" hidden></p>`,
    async fd=>{
      if(String(fd.get('conf')||'').trim().toUpperCase()!=='EXCLUIR'){erro('#v-err','Digite EXCLUIR para confirmar.');return false}
      const btn=document.querySelector('#dlgForm button[type=submit]');
      try{
        const produtos=S.produtos.slice();
        const movs=(await S.db.collection('movimentos').get()).docs.map(d=>({id:d.id,...d.data()}));
        if(fd.get('copia')){btn.textContent='Baixando a cópia…';try{await baixarCopia(produtos,movs)}catch(e){if(!confirm('Não foi possível baixar a cópia. Excluir mesmo assim?'))return false}}
        let k=0;const total=produtos.length+movs.length;
        for(const m of movs){await S.db.doc('movimentos/'+m.id).delete();if(++k%20===0)btn.textContent=`Excluindo ${k}/${total}…`}
        for(const p of produtos){await S.db.doc('produtos/'+p.id).delete();if(++k%20===0)btn.textContent=`Excluindo ${k}/${total}…`}
        toast(`Estoque excluído: ${produtos.length} produto${produtos.length===1?'':'s'} e ${movs.length} movimentaç${movs.length===1?'ão':'ões'}`);
        return true;
      }catch(e){erro('#v-err','Não foi possível excluir tudo: '+(e.message||'erro')+'. Tente de novo.');return false}
    },{submitLabel:'Excluir tudo'});
    const b=document.querySelector('#dlgForm button[type=submit]');if(b)b.classList.add('danger');
  }
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-a="excluir-estoque"]');if(b){e.preventDefault();e.stopPropagation();formExcluirTudo()}},true);

  return{formImportar,lerCsv,preparar,formExcluirTudo};
})();
</script>
