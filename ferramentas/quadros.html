<!-- Quadros Kanban (Funil, Tarefas, Pedidos) no computador:
     - para os lados: só a barra logo acima do quadro (presa no topo ao descer), com setas;
     - para baixo: a página rola direto, com as colunas na altura toda (sem barra no rodapé).
     Entra no index.html pelo ferramentas/montar.py. No celular o quadro continua deslizando com o dedo. -->
<style>
.kb-nav{display:none}
@media (min-width:901px){
  .kb-nav{display:flex;align-items:center;gap:8px;position:sticky;top:132px;z-index:7;background:var(--bg);padding:6px 0 8px;margin-bottom:-2px}
  .kb-nav button{all:unset;cursor:pointer;flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .kb-nav button:hover{border-color:var(--accent);color:var(--accent-text)}
  .kb-nav button:focus-visible{outline:2px solid var(--accent)}
  .kb-nav button:disabled{opacity:.35;cursor:default}
  .kb-top{flex:1;min-width:0;position:relative;height:16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;touch-action:none}
  .kb-top:focus-visible{outline:2px solid var(--accent)}
  .kb-top .kb-thumb{position:absolute;top:2px;bottom:2px;left:0;min-width:40px;border-radius:999px;background:var(--accent);cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .kb-top .kb-thumb:hover,.kb-top.arrastando .kb-thumb{background:var(--accent-2)}
  .kb-top.arrastando .kb-thumb{cursor:grabbing}

  /* rolagem para os lados só pela barra do topo; para baixo, a página rola direto (colunas com a altura toda) */
  .board-wrap{overflow-x:auto!important;overflow-y:hidden!important;scroll-behavior:smooth;scrollbar-width:none!important;padding-bottom:0!important}
  .board-wrap::-webkit-scrollbar{display:none!important;height:0!important;width:0!important}
  .board{align-items:start}
  .board .col{max-height:none!important;overflow:visible!important}

}
</style>
<script>
(function(){
  const larguraColuna=w=>{const c=w.querySelector('.board .col');return c?c.getBoundingClientRect().width+14:300};
  function ligar(w){
    if(w.dataset.kb)return;w.dataset.kb='1';
    const nav=document.createElement('div');nav.className='kb-nav';
    nav.innerHTML='<button type="button" data-kb="-1" aria-label="Colunas anteriores">◀</button><div class="kb-top" role="scrollbar" aria-orientation="horizontal" aria-label="Rolar as colunas" tabindex="0"><div class="kb-thumb"></div></div><button type="button" data-kb="1" aria-label="Próximas colunas">▶</button>';
    w.parentNode.insertBefore(nav,w);
    const top=nav.querySelector('.kb-top'),thumb=top.firstChild,ant=nav.querySelector('[data-kb="-1"]'),prox=nav.querySelector('[data-kb="1"]');
    // barra própria (sempre visível, também no Mac): o pegador acompanha o quadro;
    // arrastar o pegador ou clicar na trilha move o quadro
    const geo=()=>{const tw=top.clientWidth,max=Math.max(1,w.scrollWidth-w.clientWidth),th=Math.min(tw,Math.max(40,tw*w.clientWidth/Math.max(1,w.scrollWidth)));return{tw,max,th,livre:Math.max(1,tw-th)}};
    const medir=()=>{
      const sobra=w.scrollWidth-w.clientWidth;
      nav.style.display=sobra>4?'':'none';
      const g=geo();thumb.style.width=g.th+'px';thumb.style.left=(Math.min(1,w.scrollLeft/g.max)*g.livre)+'px';
      top.setAttribute('aria-valuenow',String(Math.round(w.scrollLeft/g.max*100)));
      ant.disabled=w.scrollLeft<=2;prox.disabled=w.scrollLeft>=sobra-2;
    };
    const irPara=x=>{const g=geo();w.style.scrollBehavior='auto';w.scrollLeft=Math.min(g.max,Math.max(0,x/g.livre*g.max));w.style.scrollBehavior=''};
    let arr=null;
    thumb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();arr={x:e.clientX,l:parseFloat(thumb.style.left)||0};try{thumb.setPointerCapture(e.pointerId)}catch(x){}top.classList.add('arrastando')});
    thumb.addEventListener('pointermove',e=>{if(arr)irPara(arr.l+e.clientX-arr.x)});
    const solta=()=>{arr=null;top.classList.remove('arrastando')};
    thumb.addEventListener('pointerup',solta);thumb.addEventListener('pointercancel',solta);
    top.addEventListener('pointerdown',e=>{if(e.target===thumb)return;const r=top.getBoundingClientRect(),g=geo();irPara(e.clientX-r.left-g.th/2)});
    top.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();w.scrollBy({left:(e.key==='ArrowRight'?1:-1)*larguraColuna(w),behavior:'smooth'})}});
    w.addEventListener('scroll',medir,{passive:true});
    nav.addEventListener('click',e=>{const b=e.target.closest('[data-kb]');if(b)w.scrollBy({left:Number(b.dataset.kb)*larguraColuna(w)*2,behavior:'smooth'})});
    new ResizeObserver(medir).observe(w);
    medir();
  }
  // o sistema redesenha a tela inteira: liga as barras nos quadros novos e guarda a posição da rolagem
  const posicao={};
  function varrer(){
    document.querySelectorAll('#main .board-wrap').forEach(w=>{
      const chave=(typeof S!=='undefined'&&S.view)||'q';
      if(w.dataset.kb)return;
      ligar(w);
      if(posicao[chave]){w.style.scrollBehavior='auto';w.scrollLeft=posicao[chave];w.style.scrollBehavior=''}
      w.addEventListener('scroll',()=>{posicao[chave]=w.scrollLeft},{passive:true});
    });
  }
  let marcado=false;
  const agendar=()=>{if(!marcado){marcado=true;requestAnimationFrame(()=>{marcado=false;varrer()})}};
  function iniciar(){const m=document.getElementById('main');if(m)new MutationObserver(agendar).observe(m,{childList:true,subtree:true});agendar()}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar);else iniciar();
})();
</script>
