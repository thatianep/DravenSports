<!-- Sem barras de rolagem no sistema, exceto a barra lateral do Funil (layout original). No computador:
     - Tarefas e Pedidos cabem na largura da tela; o Funil tem colunas largas e rola para os lados;
     - o menu de abas fica numa linha, com a barra de rolagem embaixo (layout original).
     Entra no index.html pelo ferramentas/montar.py. No celular o quadro continua deslizando com o dedo. -->
<style>
/* nenhuma barra de rolagem visível no sistema (página, funil, colunas, menus e janelas);
   rolar continua funcionando com a roda do mouse, o touchpad ou o dedo */
html,body,*{scrollbar-width:none!important;-ms-overflow-style:none!important}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;background:transparent!important}
@media (min-width:901px){
  /* Tarefas e Pedidos: colunas cabem na largura da tela */
  .board-wrap:has(> .board[style]){overflow:visible!important;padding-bottom:0!important}
  .board[style]{min-width:0!important;align-items:start}
  .board[style] .col,.board[style] .card{min-width:0}
  .board .col{max-height:none!important;overflow:visible!important}
  /* menu de abas: layout original, numa linha só, com a barra de rolagem embaixo */
  .nav{overflow-x:auto!important;scrollbar-width:thin!important;scrollbar-color:#C9C6BD transparent!important}
  .nav::-webkit-scrollbar{display:block!important;height:8px!important;width:auto!important;background:transparent!important}
  .nav::-webkit-scrollbar-thumb{background:#C9C6BD;border-radius:4px}
  .nav::-webkit-scrollbar-thumb:hover{background:var(--accent)}
  /* Funil: layout original, colunas largas com rolagem para os lados e a barra embaixo do quadro */
  .board-wrap:not(:has(> .board[style])){overflow-x:auto!important;overflow-y:hidden!important;scrollbar-width:auto!important;scrollbar-color:var(--accent) var(--surface-2)!important;padding-bottom:8px}
  .board-wrap:not(:has(> .board[style]))::-webkit-scrollbar{display:block!important;height:12px!important;width:auto!important;background:var(--surface-2)!important;border-radius:999px}
  .board-wrap:not(:has(> .board[style]))::-webkit-scrollbar-thumb{background:var(--accent);border-radius:999px;border:2px solid var(--surface-2)}
}
</style>
