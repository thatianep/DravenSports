<script>
window.DRAVEN_WA=(function(){
  const NOME='draven-whatsapp';
  const computador=()=>!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)&&!(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
  let jan=null;
  function abrir(url){
    if(!computador()){location.href=url&&!/web\.whatsapp\.com/.test(url)?url:'https://wa.me/';return}
    const w=Math.max(480,Math.round(screen.availWidth*0.42)),h=screen.availHeight;
    const pos=`width=${w},height=${h},left=${screen.availWidth-w},top=0`;
    if(jan&&!jan.closed){if(url)jan.location.href=url;jan.focus();return}
    jan=window.open(url||'https://web.whatsapp.com/',NOME,pos);
    if(!jan){window.open(url||'https://web.whatsapp.com/','_blank')}
  }
  const noBotao=e=>e.target.closest&&e.target.closest('.wa-cli');
  ['pointerdown','mousedown','touchstart'].forEach(t=>document.addEventListener(t,e=>{if(noBotao(e))e.stopPropagation()},{capture:true,passive:true}));
  document.addEventListener('click',e=>{
    if(noBotao(e))e.stopPropagation();
    const b=e.target.closest&&e.target.closest('[data-whatsapp-web]');
    if(b){e.preventDefault();abrir();return}
    const cl=e.target.closest&&e.target.closest('a[data-wacli]');
    if(cl&&window.DRAVEN_WAB&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){e.preventDefault();e.stopPropagation();DRAVEN_WAB.escolher(cl.dataset.wacli,Number(cl.dataset.wafone)||1);return}
    const a=e.target.closest&&e.target.closest('a[href^="https://web.whatsapp.com/"]');
    if(a&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){e.preventDefault();abrir(a.href)}
  },true);
  return{computador,abrir};
})();
</script>

/* Identidade do logo oficial: preto da letra D, branco das penas, amarelo do bico. Layout: barra lateral preta + área de trabalho clara; no celular a navegação vira faixa rolável no topo */

   faixa preta de avisos no topo, cabeçalho com logo e títulos condensados em caixa alta. Visual claro por escolha, igual à loja. */
:root{
  color-scheme:light;
  --bg:#F6F5F1; --surface:#FFFFFF; --surface-2:#FAFAF8; --line:#E5E3DD; --fg:#18181B; --muted:#71717A; --ink:#09090B;
  --accent:#D4AF37; --accent-2:#CA8A04; --accent-ink:#000000; --accent-soft:#FBF3D9; --accent-text:#8A6A00; --logo-bg:#FFFFFF; --red:#DC2626;
  --ok:#15803D; --ok-soft:#DCFCE7; --warn:#A16207; --warn-soft:#FEF3C7; --bad:#DC2626; --bad-soft:#FEE2E2; --info:#1E3A8A; --info-soft:#DBEAFE;
  --side:#FFFFFF; --side-fg:#18181B; --side-muted:#52525B; --side-hi:#F4F4F5; --head:rgba(253,253,253,.97);
  --st-lead:#1E3A8A; --st-contato:#6366F1; --st-visita:#0891B2; --st-proposta:#A855F7; --st-negociacao:#D4AF37; --st-ganho:#15803D; --st-perdido:#DC2626;
  --f-display:"Oswald","Arial Narrow",Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --r-sm:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;z-index:9}
.brand{display:flex;align-items:center;gap:12px;padding:18px 16px;border-bottom:1px solid var(--line)}
.logo-mark{width:42px;height:42px;flex:none;background:var(--logo-bg);border-radius:12px;padding:3px;box-shadow:0 6px 16px rgba(242,182,13,.18)}
.btx{flex:1;min-width:0}
.btx b{display:block;font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.15}
.btx b i{font-style:normal;color:var(--accent)}
.btx span{font-size:12px;color:var(--muted);font-weight:500}
.ibtn{all:unset;cursor:pointer;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:var(--muted)}
.ibtn:hover{background:var(--side-hi);color:var(--fg)}
.ibtn:focus-visible{outline:2px solid var(--accent)}
.ibtn svg{width:19px;height:19px}
.ico-sun{display:none}
:root[data-theme="dark"] .ico-sun{display:block} :root[data-theme="dark"] .ico-moon{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ico-sun{display:block}:root:not([data-theme="light"]) .ico-moon{display:none}}
.nav{display:flex;flex-direction:column;gap:3px;padding:12px;overflow-y:auto;flex:1}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:var(--side-muted);font-weight:500;font-size:14px}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:var(--side-hi);color:var(--side-fg)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 8px 18px rgba(242,182,13,.15)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;border-radius:999px;padding:0 7px;font-weight:600}

.me strong{display:block;color:var(--side-fg);font-weight:600;font-size:13px}
main{min-width:0}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.04)}

.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent-text)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.04)}

.board{display:grid;grid-template-columns:repeat(7,minmax(270px,1fr));gap:14px;min-width:1990px}
.col{background:color-mix(in srgb,var(--surface) 60%,var(--bg));border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}

// ---------- dados ----------
function col(n){return S.db.collection(n)}
async function salvar(colecao,id,dados){
  try{ if(id){await col(colecao).doc(id).update(dados);return id} const ref=col(colecao).doc(); await ref.set(dados); return ref.id }
  catch(e){ falha(e); throw e }
}
async function remover(colecao,id){try{await col(colecao).doc(id).delete()}catch(e){falha(e);throw e}}
async function falha(e){
  const c=e&&e.code;
  if(c==='invalid_argument'){
    // o mesmo código vem de falta de permissão ou de registro que outra pessoa excluiu: só trava a página no primeiro caso
    let w=null;try{w=S.user?await S.user.can('data.write'):null}catch(x){}
    if(w===false){S.ro=true;toast('Você não tem permissão para gravar. Peça para a gestão compartilhar a pasta do Google Drive com você como Editor.');render()}
    else toast('Este registro foi alterado ou excluído por outra pessoa. A tela já mostra a versão atual.');
  }
  else if(c==='not_granted')toast(e.message||'Seu perfil não pode fazer esta alteração.');
  else if(c==='quota_exceeded')toast('O banco de dados atingiu o limite. Exclua registros antigos para continuar.');
  else if(c==='resource_exhausted')toast('Muitas gravações seguidas. Aguarde alguns segundos e tente de novo.');
  else toast('Não foi possível salvar agora. Tente novamente.');
}
const TRAVA='aba-'+Math.random().toString(36).slice(2);
async function moverEstoque(produtoId,delta,tipo,origem,ref){
  const p=prod(produtoId); if(!p)return;
  const ref_=col('produtos').doc(produtoId);
  // trava curta no produto para duas pessoas não gravarem saldos ao mesmo tempo; lê o saldo atual do banco, não da memória
  for(let t=0;t<12;t++){let r=null;try{r=await ref_.acquire({holder:TRAVA,ttlMs:2000})}catch(x){break}if(r&&r.acquired)break;await new Promise(ok=>setTimeout(ok,350))}
  let atual=Number(p.estoque)||0;
  try{const g=await ref_.get();if(g.exists)atual=Number(g.data().estoque)||0}catch(x){}
  const novo=atual+delta;
  await ref_.update({estoque:novo});
  p.estoque=novo; // reflete já na memória para movimentos em sequência
  await col('movimentos').doc().set({produtoId,delta,saldo:novo,tipo,origem:origem||'',ref:ref||'',em:Date.now(),por:S.myId||null});
}

  S.db=db;S.user=user;S.dl=dl;S.sample=sm;
  if(!db){S.offline=true;render();return}
  if(user){const me=await user.me();S.me=me;S.myId=me.id;S.isOwner=!!me.isOwner;S.canEdit=!!me.canEdit;
    const w=await user.can('data.write'); if(w===false)S.ro=true;}
  const sub=(nome,q)=>q.onSnapshot(s=>{S[nome]=s.docs.map(d=>({id:d.id,...d.data()}));S.ready[nome]=true;render()},e=>{S.ready[nome]=true;render()});
  sub('clientes',col('clientes'));

  sub('conversas',col('conversas').orderBy('ultimaEm','desc').limit(1000));
  sub('whatsapp',col('whatsapp'));

  if(S.myId&&!S.isOwner){
    try{const r=db.doc('acessos/'+S.myId);const g=await r.get();if(!g.exists)await r.set({em:Date.now()})}catch(e){}

let resolvendo=false;
async function resolverNomes(){
  if(!S.user||resolvendo)return;
  const ids=new Set([...Object.keys(S.equipe),...S.acessos.map(a=>a.id),...S.clientes.map(c=>c.responsavel).filter(Boolean)]);
  if(S.myId)ids.add(S.myId);
  const faltam=[...ids].filter(i=>!(i in S.profiles));
  if(!faltam.length)return;
  resolvendo=true;
  try{const ps=await S.user.profiles([...ids]);Object.assign(S.profiles,ps)}finally{resolvendo=false}
  render();
}

function grafico(vendas,nm=6){

    meses.push({rot:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),v:sum(vendas.filter(x=>x.data>=d.getTime()&&x.data<fim),x=>x.total)})}
  const max=Math.max(...meses.map(m=>m.v),1);const W=520,H=200,top=24,base=170,gap=(W-40)/nm,bw=Math.min(48,gap*.62);
  const comp=v=>v>=1000?'R$ '+(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':money(v);
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vendas dos últimos seis meses">
   <line x1="20" x2="${W-20}" y1="${base}" y2="${base}" stroke="var(--line)"/>
   ${meses.map((m,i)=>{const h=m.v?Math.max(2,(m.v/max)*(base-top)):0;const x=20+gap*i+(gap-bw)/2;const last=i===nm-1;const show=nm<=6||last||m.v===max;
     return`<rect x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="8" fill="${last?'var(--accent)':'var(--accent-soft)'}"/>
     <text x="${x+bw/2}" y="${base-h-7}" text-anchor="middle" font-size="11" fill="var(--fg)" font-family="Plus Jakarta Sans,sans-serif">${m.v&&show?esc(comp(m.v)):''}</text>
     <text x="${x+bw/2}" y="${base+18}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Plus Jakarta Sans,sans-serif">${esc(m.rot)}</text>`}).join('')}
  </svg>`;
}

async function mudarStatusVenda(id,st){
  const v=S.vendas.find(x=>x.id===id);if(!v)return;
  if(st==='confirmado'){
    const falta=(v.itens||[]).map(i=>({i,p:prod(i.produtoId)})).filter(x=>x.p&&(Number(x.p.estoque)||0)<x.i.qtd);
    if(falta.length&&!await confirmar(`Estoque insuficiente: ${falta.map(x=>`${prodNome(x.p)} (tem ${n0.format(x.p.estoque||0)}, pedido ${n0.format(x.i.qtd)})`).join('; ')}. Confirmar mesmo assim deixa o saldo negativo até a reposição.`,'Confirmar assim mesmo'))return;
    for(const i of v.itens||[])await moverEstoque(i.produtoId,-i.qtd,'saida','Venda',v.numero);
    await salvar('vendas',id,{status:'confirmado',estoqueBaixado:true,confirmadoEm:Date.now()});
    const c=cli(v.clienteId);if(c&&c.etapa!=='ganho')await salvar('clientes',c.id,{etapa:'ganho'});
    toast('Pedido confirmado e estoque baixado');
  }else if(st==='entregue'){
    await salvar('vendas',id,{status:'entregue',entregueEm:Date.now()});toast('Pedido marcado como entregue');
  }else if(st==='cancelado'){
    if(!await confirmar(`Cancelar o pedido ${v.numero}?${v.estoqueBaixado?' Os itens voltam para o estoque.':''}`,'Cancelar pedido'))return;
    if(v.estoqueBaixado)for(const i of v.itens||[])await moverEstoque(i.produtoId,i.qtd,'estorno','Cancelamento de venda',v.numero);
    await salvar('vendas',id,{status:'cancelado',estoqueBaixado:false,canceladoEm:Date.now()});toast('Pedido cancelado');
  }
  fecharDlg();
}

const SEG={campeao:['Campeão','ok','3 ou mais pedidos e compra nos últimos 90 dias'],fiel:['Fiel','info','2 ou mais pedidos e compra nos últimos 150 dias'],novo:['Novo cliente','acc','1 pedido nos últimos 150 dias'],risco:['A recuperar','warn','Comprou, mas está entre 151 e 270 dias sem pedir'],inativo:['Inativo','bad','Mais de 270 dias sem comprar'],lead:['Em prospecção','','Ainda sem pedido confirmado']};
let _stK=null,_stP=null,_stN=null,_st={};
function statsDe(cid){
  if(_stK!==S.vendas||_stP!==S.produtos||_stN!==S.nps){_stK=S.vendas;_stP=S.produtos;_stN=S.nps;_st={}}
  if(_st[cid])return _st[cid];
  const vs=S.vendas.filter(v=>v.clienteId===cid&&(v.status==='confirmado'||v.status==='entregue'));
  const total=sum(vs,v=>v.total);const ult=vs.length?Math.max(...vs.map(v=>v.data||0)):null;const dias=ult?Math.floor((Date.now()-ult)/864e5):null;
  const cat={};vs.forEach(v=>(v.itens||[]).forEach(i=>{const c=prod(i.produtoId)?.categoria||'Outro';cat[c]=(cat[c]||0)+i.qtd*i.valor}));
  const catPref=Object.entries(cat).sort((a,b)=>b[1]-a[1])[0]?.[0]||null;
  let seg='lead';
  if(vs.length){seg=dias>270?'inativo':dias>150?'risco':vs.length>=3&&dias<=90?'campeao':vs.length>=2?'fiel':'novo'}
  const notas=S.nps.filter(n=>n.clienteId===cid);
  return _st[cid]={n:vs.length,total,ticket:vs.length?total/vs.length:0,ult,dias,catPref,seg,nps:notas[0]?.nota??null};
}

// ---------- CLIENTES E SEGMENTOS ----------
function publico(f={}){
  const mes=new Date().getMonth();
  return S.clientes.filter(c=>{const st=statsDe(c.id);
    if(f.segs&&f.segs.length&&!f.segs.includes(st.seg))return false;
    if(f.tipo&&c.tipo!==f.tipo)return false;
    if(f.cidade&&c.cidade!==f.cidade)return false;
    if(f.aniv&&!(c.aniversario&&new Date(c.aniversario).getMonth()===mes))return false;
    if(f.tag&&!norm(c.tags).includes(norm(f.tag)))return false;
    return c.etapa!=='perdido'||st.n>0;
  });
}

const ST_K={rascunho:['Rascunho',''],ativa:['Ativa','ok'],encerrada:['Encerrada','info']};
function ofertaTxt(o){if(!o||o.tipo==='nenhuma')return'';return o.tipo==='desconto'?`${o.valor||0}% de desconto`:o.tipo==='frete'?'frete grátis':o.tipo==='levexpaguey'?`leve ${o.x||3}, pague ${o.y||2}`:o.tipo==='brinde'?`brinde: ${o.brinde||'surpresa'}`:''}
function personalizar(msg,c,k){const o=k.oferta||{};return String(msg||'').replace(/\{(\w+)\}/g,(m,v)=>({nome:c.nome,contato:(c.contato||c.nome||'').split(' ')[0],cupom:o.cupom||'',oferta:ofertaTxt(o),validade:k.fim?fmtD(k.fim):'',cidade:c.cidade||''}[v]??m))}

  const p=publico(k.filtro||{});

  <div class="grid2">

   <section class="panel"><div class="panel-h"><h2>Por categoria</h2></div>${barsH(top(porCat),money)}</section>

function driveErro(e){
  const c=e&&e.code,m=String(e&&e.message||'');
  if(c==='tool_error'&&/permission/i.test(m))return'O Google Drive recusou por falta de permissão. Confira se a pasta DRAVEN | Plataforma Comercial está compartilhada com você como Editor.';
  return({needs_reauth:'A conexão com o Google Drive expirou. Clique em Continuar, na faixa amarela do canto da tela, para entrar de novo com o Google.',
    server_not_connected:'O Google Drive não está conectado na sua conta. Conecte em claude.ai > Configurações > Conectores.',
    selection_required:'Há mais de um Google Drive conectado. Escolha qual usar no aviso do claude.ai.',
    not_in_manifest:'O Google Drive está bloqueado para esta página. Libere no menu de permissões da página.',
    approval_required:'O claude.ai precisa da sua aprovação para usar o Google Drive. Clique de novo e aprove.',
    blocked_by_policy:'A sua organização bloqueou o Google Drive aqui.',
    server_unavailable:'O Google Drive não respondeu agora. Tente de novo em instantes.',
    not_granted:'Entre com a sua conta Google para usar o Drive.',capability_disabled:'Entre com a sua conta Google para usar o Drive.',
    tool_error:'O Google Drive recusou a operação: '+(m||'sem detalhe')+'.'}[c])||'Não foi possível falar com o Google Drive agora ('+(c||'erro')+').';
}
async function dCall(tool,input){const m=await mcpDrive();if(!m)throw{code:'not_granted'};const r=await m.callTool(DRIVE,tool,input,{cache:false});return r&&r.payload!==undefined?r.payload:r}
function driveMsg(msg,erro){S.drive.msg=msg;S.drive.erro=!!erro;if(S.view==='drive')render()}
async function salvarCfgDrive(patch){
  const ref=col('config').doc('drive');
  try{const g=await ref.get();if(g.exists)await ref.update(patch);else await ref.set(patch);S.cfgDrive={...(S.cfgDrive||{}),...patch}}catch(e){falha(e)}
}
async function pastaDrive(forcar){
  const cfg=S.cfgDrive||{};if(cfg.pastaId&&!forcar)return cfg.pastaId;
  const r=await dCall('search_files',{query:`title = '${PASTA}' and mimeType = 'application/vnd.google-apps.folder' and owner = 'me'`,excludeContentSnippets:true,pageSize:5});
  let id=r&&r.files&&r.files[0]&&r.files[0].id;
  if(!id){const f=await dCall('create_file',{title:PASTA,contentMimeType:'application/vnd.google-apps.folder'});id=f&&f.id}
  if(!id)throw{code:'tool_error',message:'a pasta não pôde ser criada'};
  await salvarCfgDrive({pastaId:id});return id;
}

function acharBase64(x){
  if(typeof x==='string')return x;if(!x||typeof x!=='object')return'';
  for(const k of['content','base64Content','data','contents','bytes','fileContent'])if(typeof x[k]==='string'&&x[k].length>20)return x[k];
  let melhor='';const ver=o=>{for(const v of Object.values(o||{})){if(typeof v==='string'&&v.length>melhor.length)melhor=v;else if(v&&typeof v==='object')ver(v)}};ver(x);return melhor;
}
async function restaurarDoDrive(fileId,titulo){
  if(!await confirmar(`Restaurar os dados da planilha "${titulo}"? Registros com o mesmo código voltam para a versão da planilha. Registros criados depois dela continuam como estão.`,'Restaurar'))return;
  if(!window.XLSX){driveMsg('A ferramenta de planilhas não carregou. Recarregue a página.',true);return}
  S.drive.ocupado=true;driveMsg('Baixando a planilha do Drive…');
  try{
    const r=await dCall('download_file_content',{fileId,exportMimeType:XLSX_MIME});
    const b64=acharBase64(r).replace(/^data:[^,]*,/,'');
    if(!b64)throw{code:'tool_error',message:'o arquivo veio vazio'};
    const wb=XLSX.read(b64,{type:'base64'});
    const regs=[];
    for(const[aba,colecao]of Object.entries(ABAS_REST)){const ws=wb.Sheets[aba];if(!ws)continue;
      for(const lin of XLSX.utils.sheet_to_json(ws,{defval:''})){const t=String(lin._dados||'').trim();if(!t.startsWith('{'))continue;
        try{const o=JSON.parse(t);const id=o.__id;delete o.__id;if(id)regs.push([colecao,String(id),o])}catch(e){}}}
    if(!regs.length)throw{code:'tool_error',message:'nenhum registro encontrado. Use uma planilha gerada por este sistema'};
    let n=0;for(const[c,id,o]of regs){await col(c).doc(id).set(o);n++;if(n%20===0)driveMsg(`Restaurando… ${n} de ${regs.length}`)}
    driveMsg(`Restauração concluída: ${n} registros de "${titulo}".`);toast('Dados restaurados');
  }catch(e){driveMsg(driveErro(e),true)}
  finally{S.drive.ocupado=false;if(S.view==='drive')render()}
}

// ---------- KANBAN: arrastar cards entre colunas (mouse e toque) ----------
// Funciona no Funil CRM (leads), em Tarefas e em Vendas (quadro de pedidos).
// No computador: clique e arraste. No celular: toque e segure o card por meio segundo, depois arraste.
var DRAG={on:false,pend:false,fim:0};
const KB_DICA='<p class="kb-hint"><i class="fa-solid fa-up-down-left-right" aria-hidden="true"></i> Arraste os cards entre as colunas. No celular, toque e segure o card antes de arrastar.</p>';
function dragIni(card,x,y){
  const r=card.getBoundingClientRect();
  DRAG.on=true;DRAG.kind=card.dataset.drag;DRAG.id=card.dataset.id;DRAG.from=card.dataset.from;DRAG.src=card;DRAG.dx=x-r.left;DRAG.dy=y-r.top;
  const g=card.cloneNode(true);g.classList.add('drag-ghost');g.removeAttribute('data-a');g.removeAttribute('tabindex');g.style.width=r.width+'px';
  document.body.appendChild(g);DRAG.ghost=g;card.classList.add('drag-src');
  try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
  dragMove(x,y);
}
function dragAlvo(x,y){const el=document.elementFromPoint(x,y);const c=el&&el.closest('[data-drop]');return c&&c.dataset.drop===DRAG.kind?c:null}
function dragMove(x,y){
  if(!DRAG.on)return;
  DRAG.ghost.style.left=(x-DRAG.dx)+'px';DRAG.ghost.style.top=(y-DRAG.dy)+'px';DRAG.lx=x;DRAG.ly=y;
  const alvo=dragAlvo(x,y);
  if(alvo!==DRAG.alvo){DRAG.alvo&&DRAG.alvo.classList.remove('drop-on');alvo&&alvo.classList.add('drop-on');DRAG.alvo=alvo}
  // rola o quadro e a página quando o card chega perto das bordas
  const w=DRAG.src&&DRAG.src.closest('.board-wrap');
  if(w){const r=w.getBoundingClientRect();if(x<r.left+48)w.scrollLeft-=16;else if(x>r.right-48)w.scrollLeft+=16}
  if(y<70)window.scrollBy(0,-14);else if(y>innerHeight-70)window.scrollBy(0,14);
}
async function dragFim(soltar){
  if(!DRAG.on)return;
  const alvo=soltar?dragAlvo(DRAG.lx,DRAG.ly):null;
  DRAG.ghost&&DRAG.ghost.remove();DRAG.src&&DRAG.src.classList.remove('drag-src');DRAG.alvo&&DRAG.alvo.classList.remove('drop-on');
  const {kind,id,from}=DRAG;
  Object.assign(DRAG,{on:false,ghost:null,src:null,alvo:null,fim:Date.now()});
  if(DRAG.pend){DRAG.pend=false;render()}
  if(alvo&&alvo.dataset.col!==from)await soltarCard(kind,id,alvo.dataset.col);
}
// mouse
let PEND=null;
document.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse'||e.button!==0)return;
  const card=e.target.closest('[data-drag]');if(!card||e.target.closest('select,button,a,input,textarea'))return;
  PEND={card,x:e.clientX,y:e.clientY};
});
document.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  if(PEND&&!DRAG.on&&Math.hypot(e.clientX-PEND.x,e.clientY-PEND.y)>6){dragIni(PEND.card,PEND.x,PEND.y);PEND=null}
  if(DRAG.on){e.preventDefault();dragMove(e.clientX,e.clientY)}
});
document.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')return;PEND=null;if(DRAG.on)dragFim(true)});
// toque: segurar para arrastar, deslizar sem segurar continua rolando a tela
let TOQUE=null;
document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1){if(TOQUE){clearTimeout(TOQUE.t);TOQUE=null}return}
  const card=e.target.closest('[data-drag]');if(!card||e.target.closest('select,button,a,input,textarea'))return;
  const t=e.touches[0];TOQUE={card,x:t.clientX,y:t.clientY};
  TOQUE.t=setTimeout(()=>{if(TOQUE)dragIni(TOQUE.card,TOQUE.x,TOQUE.y)},420);
},{passive:true});
document.addEventListener('touchmove',e=>{
  const t=e.touches[0];
  if(DRAG.on){e.preventDefault();dragMove(t.clientX,t.clientY);return}
  if(TOQUE&&Math.hypot(t.clientX-TOQUE.x,t.clientY-TOQUE.y)>10){clearTimeout(TOQUE.t);TOQUE=null}
},{passive:false});
document.addEventListener('touchend',e=>{if(TOQUE){clearTimeout(TOQUE.t);TOQUE=null}if(DRAG.on){e.preventDefault();dragFim(true)}},{passive:false});
document.addEventListener('touchcancel',()=>{if(TOQUE){clearTimeout(TOQUE.t);TOQUE=null}dragFim(false)});
document.addEventListener('contextmenu',e=>{if(DRAG.on||(TOQUE&&e.target.closest('[data-drag]')))e.preventDefault()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&DRAG.on)dragFim(false)});
// depois de soltar, o clique que o navegador dispara não abre o card
document.addEventListener('click',e=>{if(Date.now()-DRAG.fim<400){e.stopPropagation();e.preventDefault()}},true);

const colPedido=v=>(v.status==='orcamento'||v.status==='confirmado')&&loteAberto(v)?'producao':(v.status||'orcamento');

      <div class="d">${n0.format(sum(v.itens||[],i=>i.qtd))} peça${sum(v.itens||[],i=>i.qtd)===1?'':'s'} · ${esc(v.pagamento||'')}</div>
      ${lt?`<div class="d">Lote ${esc(lt.numero)} · pronto ${fmtD(lt.previsao)}</div>`:''}
      <div class="row"><b style="font-variant-numeric:tabular-nums">${money(v.total)}</b>${ativo&&v.prazo?due(v.prazo,ini,fim):`<span class="due">${fmtD(v.entregueEm||v.data)}</span>`}</div>
      </div>`}).join('')}
    ${mais?`<div class="col-mais">+ ${mais} mais antigo${mais===1?'':'s'} na Lista</div>`:''}

async function moverPedido(id,para){
  const v=S.vendas.find(x=>x.id===id);if(!v)return;const de=colPedido(v);if(de===para)return;
  if(para==='orcamento'){toast('Um pedido confirmado não volta para orçamento. Se precisar, cancele e crie outro.');return}
  if(para==='confirmado'){
    if(v.status==='confirmado'){toast(`O pedido continua confirmado. O lote ${loteAberto(v)?.numero||''} segue em produção: conclua o lote em Produção e lotes.`);return}
    if(v.status!=='orcamento'){toast('Só orçamentos podem ser confirmados.');return}
    if(!pode('vendas')){toast('Só Gestão e Vendas confirmam pedidos.');return}
    return mudarStatusVenda(id,'confirmado');
  }
  if(para==='producao'){
    if(v.status!=='orcamento'&&v.status!=='confirmado'){toast('Pedidos entregues ou cancelados não vão para produção.');return}
    if(!pode('producao')){toast('Só Gestão e Estoque enviam pedidos para produção.');return}
    if(!S.produtos.length){toast('Cadastre os produtos no Estoque primeiro.');return}
    toast('Confira o lote e salve para o pedido entrar em produção');return formLote({},id);
  }
  if(para==='entregue'){
    if(v.status==='orcamento'){toast('Confirme o pedido antes de marcar como entregue.');return}
    if(v.status!=='confirmado'){toast('Este pedido não pode ser marcado como entregue.');return}
    if(!pode('entregar')){toast('Só Gestão e Estoque marcam pedidos como entregues.');return}
    const lt=loteAberto(v);
    if(!await confirmar(`Marcar o pedido ${v.numero} como entregue?${lt?` O lote ${lt.numero} ainda está em produção.`:''}`,'Marcar como entregue'))return;
    return mudarStatusVenda(id,'entregue');
  }
  if(para==='cancelado'){
    const ok=((v.status==='orcamento'||v.status==='confirmado')&&pode('vendas'))||(v.status==='entregue'&&pode('excluir'));
    if(!ok){toast('Seu perfil não pode cancelar este pedido.');return}
    return mudarStatusVenda(id,'cancelado');
  }
}

  if(vs.length)grupos.push(['Pedidos',vs.map(v=>`<button data-a="ver-venda" data-id="${v.id}"><b class="mono">${esc(v.numero)}</b><span>${esc(cli(v.clienteId)?.nome||'')} · ${money(v.total)}</span></button>`)]);

  if(S.producao&&papel()!=='vendedor'){const ls=S.producao.filter(l=>norm(l.numero).includes(q)).slice(0,4);if(ls.length)grupos.push(['Produção',ls.map(l=>`<button data-a="ver-lote" data-id="${l.id}"><b class="mono">${esc(l.numero)}</b><span>${ST_C[l.status]?.[0]||''}</span></button>`)])}
  box.innerHTML=grupos.length?grupos.map(g=>`<div class="gg"><small>${g[0]}</small>${g[1].join('')}</div>`).join(''):'<p class="ro" style="padding:10px">Nada encontrado.</p>';
  box.hidden=false;
}

const COLS_IMP={nome:['nome','empresa','academia','cliente','razao social','razão social','name'],contato:['contato','responsavel','responsável','pessoa'],telefone:['telefone','whatsapp','celular','fone','phone','tel'],
  email:['email','e-mail','mail'],cidade:['cidade','municipio','município','city'],tipo:['tipo','segmento'],origem:['origem','canal','fonte','source'],instagram:['instagram','ig'],modalidades:['interesse','produto','modalidade','modalidades'],obs:['observacao','observação','obs','nota','notas']};
function lerTabela(txt){
  const linhas=String(txt||'').replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(linhas.length<2)return{erro:'Cole o cabeçalho e pelo menos uma linha de dados.'};
  const sep=linhas[0].includes('\t')?'\t':(linhas[0].split(';').length>linhas[0].split(',').length?';':',');
  const parse=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===sep&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(x=>x.trim())};
  const cab=parse(linhas[0]).map(h=>norm(h).trim());
  const map={};Object.entries(COLS_IMP).forEach(([k,al])=>{const i=cab.findIndex(h=>al.some(a=>norm(a)===h));if(i>=0)map[k]=i});
  if(map.nome==null)return{erro:'Não encontrei a coluna de nome. Use um cabeçalho como "Nome", "Empresa" ou "Academia".'};
  const rows=linhas.slice(1).map(parse).map(r=>{const o={};Object.entries(map).forEach(([k,i])=>o[k]=r[i]||'');return o}).filter(o=>o.nome);
  return{rows,cols:Object.keys(map)};
}

  enviarConversa.ocupado=true;btn&&(btn.disabled=true);DRAFT[id]='';if(t)t.value='';
  try{await waApi('/api/wa/send',{conversaId:id,texto})}catch(e){toast(e.message||'Não foi possível enviar.');DRAFT[id]=texto;const n=$('#cv-txt');if(n&&!n.value)n.value=texto}
  enviarConversa.ocupado=false;const b2=$('[data-a=cv-enviar]');if(b2)b2.disabled=false;$('#cv-txt')?.focus();
}

let LIB_EM=0;

  DRAVEN_GH.equipe.listar().then(l=>{S.liberados=l;S.liberadosErro='';if(S.view==='equipe')render()})

<!-- Importar leads: planilha CSV/colada ou contatos .vcf (Google Contatos, celular).
     Substitui o importador do sistema (mesmos nomes de função). Entra no index.html pelo ferramentas/montar.py.
     - reconhece "Telefone 1", "Telefone 2", "Celular"… e arquivos .vcf;
     - junta os telefones da mesma empresa (no .vcf, "NOME 2" é o segundo número de NOME) em Telefone e Telefone 2;
     - limpa os números (tira o 55, ignora "55" sozinho e números falsos como 11999999999);
     - celular (11 dígitos começando com 9) fica com WhatsApp; fixo fica com o botão Ligar;
     - quem já está no CRM não é duplicado: só ganha o telefone que faltava. -->
<script>
(function(){
  const ALIAS={nome:['nome','empresa','academia','cliente','razao social','nome fantasia','name'],contato:['contato','responsavel','pessoa'],
    telefone:['telefone','whatsapp','celular','fone','phone','tel'],email:['email','e-mail','mail'],cidade:['cidade','municipio','city'],tipo:['tipo','segmento'],
    origem:['origem','canal','fonte','source'],instagram:['instagram','ig'],modalidades:['interesse','produto','modalidade','modalidades'],obs:['observacao','obs','nota','notas']};
  const chave=s=>norm(s).replace(/[^a-z0-9]+/g,' ').trim();

  // número brasileiro só com DDD + número (10 fixo, 11 celular); '' quando inválido
  function telBR(raw){
    let d=String(raw||'').replace(/\D/g,'');
    if(d.startsWith('55')&&d.length>=12)d=d.slice(2);
    d=d.replace(/^0+/,'');
    if(d.length!==10&&d.length!==11)return'';
    const num=d.slice(2);
    if(/^(\d)\1+$/.test(num))return'';          // 99999999, 00000000…
    if(/^9?9{8}$/.test(num))return'';           // 999999999 (número de mentira)
    return d;
  }
  const ehCelular=d=>d.length===11&&d[2]==='9';
  window.telBR=telBR;window.ehCelular=ehCelular;

  function palpiteTipo(nome){
    const n=' '+chave(nome)+' ';
    if(/(federa|liga )/.test(n))return'Outro';
    if(/ (team|equipe|time) /.test(n))return'Equipe/Time';
    if(/(academia|gym| ct |dojo|studio|centro|escola|thai|box|jiu|judo|karate|krav|kung|capoeira|mma|luta|fight|marcia|bjj|taekwondo|aikido|kickbox)/.test(n))return'Academia';
    return'Outro';
  }

  function lerVcf(txt){
    const linhas=String(txt).replace(/\r/g,'').replace(/\n[ \t]/g,'').split('\n');
    const rows=[];let cur=null;
    for(const l of linhas){
      const u=l.toUpperCase();
      if(u.startsWith('BEGIN:VCARD')){cur={nome:'',org:'',fones:[],email:''};continue}
      if(!cur)continue;
      if(u.startsWith('END:VCARD')){
        // o Google Contatos chama o segundo contato da mesma empresa de "NOME 2"
        const nome=String(cur.nome||cur.org).replace(/\s+\d{1,2}$/,'').trim();
        if(nome)rows.push({nome,fones:cur.fones,email:cur.email});
        cur=null;continue;
      }
      const i=l.indexOf(':');if(i<0)continue;
      const k=l.slice(0,i).split(';')[0].toUpperCase().replace(/^ITEM\d+\./,'');
      const v=l.slice(i+1).replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\n/gi,' ').trim();
      if(k==='FN')cur.nome=v;else if(k==='ORG'&&!cur.org)cur.org=v.split(';')[0];else if(k==='TEL')cur.fones.push(v);else if(k==='EMAIL'&&!cur.email)cur.email=v;
    }
    return{rows,cols:['nome','telefone'],formato:'contatos (.vcf)'};
  }

  function lerCsv(txt){
    const linhas=String(txt||'').replace(/^﻿/,'').replace(/\r/g,'').split('\n').filter(l=>l.trim());
    if(linhas.length<2)return{erro:'Cole o cabeçalho e pelo menos uma linha de dados.'};
    const sep=linhas[0].includes('\t')?'\t':(linhas[0].split(';').length>linhas[0].split(',').length?';':',');
    const parse=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===sep&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(x=>x.trim())};
    const cab=parse(linhas[0]).map(chave);
    const casa=(h,al)=>al.some(a=>{a=chave(a);return h===a||h.startsWith(a+' ')||h.endsWith(' '+a)});
    const map={},fones=[];
    cab.forEach((h,i)=>{
      if(casa(h,ALIAS.telefone)){fones.push(i);return}
      for(const[k,al]of Object.entries(ALIAS))if(k!=='telefone'&&map[k]==null&&casa(h,al)){map[k]=i;break}
    });
    if(map.nome==null)return{erro:'Não encontrei a coluna de nome. Use um cabeçalho como "Nome", "Empresa" ou "Academia".'};
    const rows=linhas.slice(1).map(parse).map(r=>{const o={fones:fones.map(i=>r[i]||'')};Object.entries(map).forEach(([k,i])=>o[k]=r[i]||'');return o}).filter(o=>String(o.nome||'').trim());
    return{rows,cols:[...Object.keys(map),...(fones.length?['telefone'+(fones.length>1?' ('+fones.length+' colunas)':'')]:[])],formato:'planilha'};
  }

  // mesma assinatura do sistema
  window.lerTabela=function(txt){return /BEGIN:VCARD/i.test(String(txt||''))?lerVcf(txt):lerCsv(txt)};

  function preparar(r){
    // 1) junta linhas da mesma empresa e os telefones dela
    const grupos=new Map();
    for(const o of r.rows){
      const nome=String(o.nome||'').trim();if(!nome)continue;
      const k=chave(nome);let g=grupos.get(k);
      if(!g){g={...o,nome,fones:[]};grupos.set(k,g)}
      else for(const f of['contato','email','cidade','tipo','origem','instagram','modalidades','obs'])if(!g[f]&&o[f])g[f]=o[f];
      for(const f of(o.fones||[])){const d=telBR(f);if(d&&!g.fones.includes(d))g.fones.push(d)}
    }
    // 2) compara com o CRM
    const porNome=new Map(),porTel=new Map();
    for(const c of S.clientes){porNome.set(chave(c.nome),c);for(const t of[c.telefone,c.telefone2]){const d=telBR(t);if(d)porTel.set(d,c)}}
    const novos=[],atualiza=[],iguais=[];
    for(const[k,g]of grupos){
      const c=porNome.get(k)||g.fones.map(f=>porTel.get(f)).find(Boolean);
      if(!c){novos.push(g);continue}   // empresas diferentes com o mesmo telefone (ex.: federações no mesmo escritório) entram as duas
      const tem=[telBR(c.telefone),telBR(c.telefone2)].filter(Boolean),extra=g.fones.filter(f=>!tem.includes(f));
      const patch={},ex=[...extra];
      if(ex.length&&!telBR(c.telefone)){const f=ex.shift();patch.telefone=fmtTelBR(f);patch.semWhats=!ehCelular(f)}
      if(ex.length&&!telBR(c.telefone2)){const f=ex.shift();patch.telefone2=fmtTelBR(f);patch.semWhats2=!ehCelular(f)}
      if(Object.keys(patch).length)atualiza.push({c,patch,g});else iguais.push(g);
    }
    return{novos,atualiza,iguais};
  }

  window.previaImport=function(txt){
    const box=$('#i-prev');if(!box)return;
    const r=lerTabela(txt);
    if(r.erro){IMP=null;box.innerHTML=String(txt||'').trim()?`<p class="err">${esc(r.erro)}</p>`:'';return}
    const p=preparar(r);IMP={...p,dups:p.iguais};
    const cel=p.novos.filter(g=>g.fones.some(ehCelular)).length,semTel=p.novos.filter(g=>!g.fones.length).length,fixo=p.novos.length-cel-semTel;
    const botao=d=>d?(ehCelular(d)?'<span class="pill ok">WhatsApp</span>':'<span class="pill info">Ligar</span>'):'';
    box.innerHTML=`<div class="notice"><b>${p.novos.length}</b> lead${p.novos.length===1?'':'s'} novo${p.novos.length===1?'':'s'} (${cel} com celular/WhatsApp, ${fixo} só com fixo, ${semTel} sem telefone)${p.atualiza.length?` · <b>${p.atualiza.length}</b> já no CRM ganha${p.atualiza.length===1?'':'m'} o telefone que faltava`:''}${p.iguais.length?` · ${p.iguais.length} já no CRM sem novidade`:''}. Arquivo lido como ${r.formato}.</div>
    ${p.novos.length||p.atualiza.length?`<div class="tbl-wrap" style="max-height:260px;overflow:auto"><table style="min-width:560px"><thead><tr><th>Nome</th><th>Telefone</th><th>Telefone 2</th><th>Situação</th></tr></thead><tbody>
    ${p.novos.slice(0,60).map(g=>`<tr><td>${esc(g.nome)}</td><td style="white-space:nowrap">${esc(fmtTelBR(g.fones[0]||''))} ${botao(g.fones[0])}</td><td style="white-space:nowrap">${esc(fmtTelBR(g.fones[1]||''))} ${botao(g.fones[1])}</td><td>Novo lead</td></tr>`).join('')}
    ${p.atualiza.slice(0,30).map(a=>`<tr><td>${esc(a.c.nome)}</td><td style="white-space:nowrap">${esc(a.patch.telefone||a.c.telefone||'')}</td><td style="white-space:nowrap">${esc(a.patch.telefone2||a.c.telefone2||'')}</td><td>Ganha telefone</td></tr>`).join('')}
    </tbody></table></div>${p.novos.length>60?`<p class="ro" style="margin:0">Mostrando 60 de ${p.novos.length} novos.</p>`:''}`:''}`;
  };

  window.formImportar=function(){
    IMP=null;
    abrir('Importar leads',`
    <p class="sub" style="margin:0">Escolha o arquivo exportado (planilha <b>CSV</b> ou contatos <b>.vcf</b> do Google Contatos/celular) ou cole as linhas de uma planilha com o cabeçalho. Basta ter <b>Nome</b> e <b>Telefone</b>; também são reconhecidas Telefone 2, Contato, E-mail, Cidade, Tipo, Canal, Instagram, Interesse e Observação.</p>
    <label class="f">Arquivo (CSV ou VCF)<input class="inp" id="i-arq" type="file" accept=".csv,.txt,.vcf,text/csv,text/vcard,text/x-vcard"></label>
    <label class="f">Ou cole aqui<textarea class="inp mono" id="i-txt" rows="6" placeholder="Nome,Telefone 1&#10;CT Exemplo,5511900000000"></textarea></label>
    <div class="fg"><label class="f">Canal dos leads<select class="inp" id="i-orig" name="origem">${ORIGENS.map(o=>`<option ${o==='Prospecção ativa'?'selected':''}>${o}</option>`).join('')}</select></label>
    <label class="f">Responsável<select class="inp" id="i-resp" name="responsavel">${membrosOpts(S.myId)}</select></label></div>
    <label class="chk"><input type="checkbox" name="pularSemTel"> Não importar quem está sem telefone</label>
    <p class="ro" style="margin:0">Celular (com 9 na frente) entra com o botão <b>WhatsApp</b>; telefone fixo entra com o botão <b>Ligar</b>. Dá para mudar depois na ficha do cliente. Contatos repetidos da mesma empresa viram um lead só, com Telefone e Telefone 2.</p>
    <div id="i-prev"></div><p class="err" id="v-err" hidden></p>`,
    async fd=>{
      if(!IMP||(!IMP.novos.length&&!IMP.atualiza.length)){erro('#v-err','Nenhum lead novo ou telefone novo para importar.');return false}
      const pular=!!fd.get('pularSemTel');
      const novos=IMP.novos.filter(g=>!pular||g.fones.length);
      const btn=$('#dlgForm button[type=submit]'),agora=Date.now(),total=novos.length+IMP.atualiza.length;let n=0;
      const canal=fd.get('origem'),resp=fd.get('responsavel')||null;
      for(const g of novos){
        const[f1,f2,...outros]=g.fones;
        const origem=ORIGENS.find(o=>norm(o)===norm(g.origem))||(g.origem?'Outro':canal);
        await salvar('clientes',null,{nome:g.nome,contato:g.contato||'',telefone:f1?fmtTelBR(f1):'',semWhats:!!f1&&!ehCelular(f1),telefone2:f2?fmtTelBR(f2):'',semWhats2:!!f2&&!ehCelular(f2),
          email:g.email||'',cidade:g.cidade||'',tipo:TIPOS.find(t=>norm(t)===norm(g.tipo))||palpiteTipo(g.nome),origem,origemDetalhe:g.origem&&origem==='Outro'?g.origem:'',
          instagram:g.instagram||'',modalidades:g.modalidades||'',etapa:'lead',responsavel:resp,proximaAcao:f1?'Fazer primeiro contato':'Encontrar telefone',dataProxima:agora+864e5,
          consentWhats:false,consentEmail:false,valorEstimado:0,criadoEm:agora,atualizadoEm:agora,criadoPor:S.myId,entradaManual:true,
          historico:[{txt:`Lead importado de lista · canal: ${origem}${outros.length?' · outros telefones: '+outros.map(fmtTelBR).join(', '):''}${g.obs?' · '+g.obs:''}`,em:agora,por:S.myId}]});
        n++;if(n%10===0)btn.textContent=`Importando ${n}/${total}…`;
      }
      for(const a of IMP.atualiza){
        const c=cli(a.c.id)||a.c;
        await salvar('clientes',c.id,{...a.patch,atualizadoEm:agora,historico:[...(c.historico||[]),{txt:`Telefone adicionado pela importação: ${[a.patch.telefone,a.patch.telefone2].filter(Boolean).join(', ')}`,em:agora,por:S.myId}]});
        n++;if(n%10===0)btn.textContent=`Importando ${n}/${total}…`;
      }
      toast(`${novos.length} lead${novos.length===1?'':'s'} importado${novos.length===1?'':'s'}${IMP.atualiza.length?` · ${IMP.atualiza.length} com telefone novo`:''}`);
      return true;
    },{submitLabel:'Importar',ctx:{tipo:'importar'}});
  };
})();
</script>

<script>
window.DRAVEN_VIS=(function(){
  const LOCAIS={loja:'Na nossa loja',academia:'Na academia do lead'};
  // endereço da loja: o salvo no sistema ou o da sede
  const cfgLoja=()=>{const c=((S.config||[]).find(x=>x.id==='loja')||{});return{...c,endereco:c.endereco||'Av. Álvaro Ramos, 2401 - Quarta Parada, São Paulo - SP'}};
  const doisDig=n=>String(n).padStart(2,'0');
  const dataInp=ms=>{if(!ms)return'';const d=new Date(ms);return`${d.getFullYear()}-${doisDig(d.getMonth()+1)}-${doisDig(d.getDate())}`};
  const horaInp=ms=>{if(!ms)return'';const d=new Date(ms);return`${doisDig(d.getHours())}:${doisDig(d.getMinutes())}`};
  const quando=(data,hora)=>data?new Date(`${data}T${hora||'09:00'}`).getTime():null;
  const fmtQuando=ms=>{const d=new Date(ms);return`${d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})} às ${doisDig(d.getHours())}:${doisDig(d.getMinutes())}`};
  const mapa=end=>end?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(end):'';
  const endAcademia=c=>[c.endereco,c.cidade].filter(Boolean).join(' - ');

  // ---------------- última ação ----------------
  function curto(h){
    const t=String(h.txt||'');
    if(h.tipo==='whatsapp')return'WhatsApp enviado';
    if(h.tipo==='ligacao')return'Ligação';
    if(h.tipo==='visita')return'Visita agendada';
    if(/^Etapa do funil:/.test(t))return'Etapa → '+t.split('→').pop().trim();
    if(/^Lead importado/.test(t))return'Importado de lista';
    if(/^Lead cadastrado/.test(t))return'Cadastrado';
    if(/^Telefone adicionado/.test(t))return'Telefone adicionado';
    return t.length>60?t.slice(0,58)+'…':t;
  }
  function ultimaAcao(c){
    let u=null;
    for(const h of(c.historico||[]))if(h&&h.em&&(!u||h.em>=u.em))u={em:h.em,txt:curto(h),por:h.por};
    for(const v of(S.vendas||[]))if(v.clienteId===c.id){
      for(const[em,txt]of[[v.criadoEm||v.data,`Orçamento ${v.numero||''}`],[v.confirmadoEm,`Pedido ${v.numero||''} confirmado`],[v.entregueEm,`Pedido ${v.numero||''} entregue`]])
        if(em&&(!u||em>u.em))u={em,txt,por:v.criadoPor};
    }
    if(!u&&c.criadoEm)u={em:c.criadoEm,txt:'Cadastrado',por:c.criadoPor};
    return u;
  }
  function ha(ms){
    const s=(Date.now()-ms)/1000;
    if(s<90)return'agora';if(s<3600)return`há ${Math.round(s/60)} min`;if(s<86400)return`há ${Math.round(s/3600)} h`;
    if(s<7*86400)return`há ${Math.round(s/86400)} d`;return fmtD(ms);
  }
  const primeiroNome=id=>String(pessoa(id)||'').split(' ')[0];
  function uaCard(c){const u=ultimaAcao(c);return u?`<div class="ua" title="Última ação: ${esc(u.txt)} · ${esc(new Date(u.em).toLocaleString('pt-BR'))}"><i class="fa-solid fa-clock-rotate-left"></i><span>${esc(u.txt)} · ${esc(ha(u.em))}${u.por?' · '+esc(primeiroNome(u.por)):''}</span></div>`:''}
  function uaCol(c){const u=ultimaAcao(c);return u?`<div class="ua-col">${esc(u.txt)}<small>${esc(ha(u.em))}${u.por?' · '+esc(pessoa(u.por)):''}</small></div>`:'<span class="ro">—</span>'}

  // ---------------- várias visitas por lead ----------------
  // cada lead guarda todas as visitas em "visitas"; "visita" é a próxima (usada nas mensagens de WhatsApp)
  const SITU={agendada:['Agendada',''],realizada:['Realizada','ok'],cancelada:['Cancelada','bad']};
  const novoVid=()=>'v'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  function visitasDe(c){
    let l=Array.isArray(c.visitas)?c.visitas.filter(v=>v&&v.quando):[];
    if(!l.length&&c.visita&&c.visita.quando)l=[{id:'v0',status:'agendada',...c.visita}];
    return l.map(v=>({status:'agendada',...v}));
  }
  function proxima(l){
    const ag=l.filter(v=>v.status==='agendada');
    return ag.filter(v=>v.quando>=Date.now()-3600e3).sort((a,b)=>a.quando-b.quando)[0]||ag.sort((a,b)=>b.quando-a.quando)[0]||null;
  }
  // ordem para mostrar: agendadas (da mais próxima), depois as outras (da mais recente)
  const ordenar=l=>[...l.filter(v=>v.status==='agendada').sort((a,b)=>a.quando-b.quando),...l.filter(v=>v.status!=='agendada').sort((a,b)=>b.quando-a.quando)];

  function linhaVisita(c,v,podeEditar){
    const late=v.status==='agendada'&&v.quando<Date.now()-3600e3,cls=v.status==='realizada'?'feita':v.status==='cancelada'?'cancelada':late?'atrasada':'';
    return`<div class="vis-it ${cls}">
      <span class="vis-l"><i class="fa-solid ${v.status==='realizada'?'fa-circle-check':v.status==='cancelada'?'fa-circle-xmark':'fa-calendar-check'}"></i> <b>${esc(fmtQuando(v.quando))}</b>${v.status!=='agendada'?` · ${SITU[v.status][0]}`:late?' · atrasada':''}</span>
      <span class="vis-l"><i class="fa-solid ${v.local==='loja'?'fa-store':'fa-dumbbell'}"></i> ${esc(LOCAIS[v.local]||'')}${v.endereco?` · <a href="${esc(mapa(v.endereco))}" target="_blank" rel="noopener" title="${esc(v.endereco)}">rota</a>`:''}</span>
      ${v.obs?`<span class="vis-obs">${esc(v.obs)}</span>`:''}
      ${podeEditar?`<span><button type="button" data-visita="${esc(c.id)}" data-vid="${esc(v.id)}">${late?'concluir ou remarcar':'alterar'}</button></span>`:''}
    </div>`;
  }
  function visCard(c){
    const l=visitasDe(c),pe=pode('crm');
    if(!l.length)return(c.etapa||'lead')==='visita'&&pe?`<div class="vis-box pendente"><span><i class="fa-solid fa-calendar-plus"></i> Falta marcar a visita · <button type="button" data-visita="${esc(c.id)}">agendar</button></span></div>`:'';
    return`<div class="vis-box">${ordenar(l).map(v=>linhaVisita(c,v,pe)).join('')}${pe?`<span><button type="button" data-visita="${esc(c.id)}" data-vid="nova"><i class="fa-solid fa-plus"></i> nova visita</button></span>`:''}</div>`;
  }
  // ficha (aba Dados): endereço do lead e a lista de todas as visitas
  function camposFicha(c,d){
    const l=c.id?visitasDe(c):[];
    return`<label class="f full">Endereço (academia do lead)<input class="inp" id="c-end" name="endereco" value="${esc(c.endereco||'')}" placeholder="Rua, número, bairro" ${d}></label>
    ${c.id?`<fieldset class="vis-f"><legend>Visitas (${l.length})</legend>
     ${l.length?`<div class="vis-box">${ordenar(l).map(v=>linhaVisita(c,v,!d&&pode('crm'))).join('')}</div>`:'<p class="ro" style="margin:0">Nenhuma visita ainda.</p>'}
     ${!d&&pode('crm')?`<div><button type="button" class="btn sm" data-visita="${esc(c.id)}" data-vid="nova"><i class="fa-solid fa-calendar-plus"></i> Agendar nova visita</button></div>`:''}
    </fieldset>`:''}`;
  }
  function lerFicha(fd){return{endereco:String(fd.get('endereco')||'').trim()}}

  // ---------------- janela "Agendar visita" (nova ou alterar uma) ----------------
  function agendar(id,vid){
    const c=cli(id);if(!c)return;
    if(!pode('crm')){toast('Seu perfil não pode agendar visitas.');return}
    const lista=visitasDe(c),v=(vid&&vid!=='nova'&&lista.find(x=>x.id===vid))||null,nova=!v;
    const ref=v||proxima(lista)||{},local=ref.local||'academia',loja=cfgLoja().endereco||'';
    const endIni=(v&&v.endereco)||(local==='loja'?loja:(ref.endereco&&ref.local==='academia'?ref.endereco:endAcademia(c)));
    const amanha=new Date(Date.now()+864e5);
    abrir(`${nova?'Agendar visita':'Visita'} · ${esc(c.nome)}`,`
     <div class="vis-locais" role="radiogroup" aria-label="Onde será a visita">
      ${Object.entries(LOCAIS).map(([k,n])=>`<label><input type="radio" name="local" value="${k}" ${local===k?'checked':''}> <i class="fa-solid ${k==='loja'?'fa-store':'fa-dumbbell'}"></i> ${n}</label>`).join('')}
     </div>
     <div class="fg">
      <label class="f full">Endereço *<input class="inp" id="va-end" name="endereco" required value="${esc(endIni)}" placeholder="Rua, número, bairro, cidade"></label>
      <label class="f">Dia *<input class="inp" id="va-dia" name="dia" type="date" required value="${v?dataInp(v.quando):dataInp(amanha)}"></label>
      <label class="f">Hora *<input class="inp" id="va-hora" name="hora" type="time" required value="${v?horaInp(v.quando):'10:00'}"></label>
      <label class="f full">Observação<input class="inp" id="va-obs" name="obs" value="${esc(v?v.obs||'':'')}" placeholder="Levar amostras de luvas 14oz, falar com o Prof. Carlos…"></label>
      ${nova?'':`<label class="f">Situação<select class="inp" id="va-sit" name="status">${Object.entries(SITU).map(([k,n])=>`<option value="${k}" ${v.status===k?'selected':''}>${n[0]}</option>`).join('')}</select></label>`}
     </div>
     ${nova?'<label class="chk"><input type="checkbox" name="tarefa" checked> Criar tarefa de visita para o responsável</label>':''}
     ${lista.length&&nova?`<p class="ro" style="margin:0">Este lead já tem ${lista.length} visita${lista.length===1?'':'s'}; elas continuam guardadas.</p>`:''}
     <p class="err" id="v-err" hidden></p>`,
    async fd=>{
      const loc=fd.get('local')||'academia',end=String(fd.get('endereco')||'').trim(),q=quando(fd.get('dia'),fd.get('hora'));
      if(!end){erro('#v-err','Informe o endereço da visita.');return false}
      if(!q){erro('#v-err','Informe o dia e a hora.');return false}
      const atual=cli(id)||c,agora=Date.now(),obs=String(fd.get('obs')||'').trim(),status=nova?'agendada':(fd.get('status')||'agendada');
      const l=visitasDe(atual),desc=`${LOCAIS[loc]} · ${end}${obs?' · '+obs:''}`;
      let vis;
      if(nova){
        vis={id:novoVid(),status:'agendada',local:loc,endereco:end,quando:q,obs,agendadaEm:agora,agendadaPor:S.myId,tarefaId:null};
        if(fd.get('tarefa')){try{vis.tarefaId=await salvar('tarefas',null,{titulo:`Visita: ${atual.nome}`,tipo:'Visita',clienteId:id,status:'afazer',prioridade:'alta',prazo:q,
          responsavel:atual.responsavel||S.myId,descricao:desc,criadoEm:agora,criadoPor:S.myId})}catch(e){}}
        l.push(vis);
      }else{
        const k=l.findIndex(x=>x.id===v.id);
        vis={...l[k],local:loc,endereco:end,quando:q,obs,status,atualizadaEm:agora,atualizadaPor:S.myId};l[k]=vis;
        if(vis.tarefaId){try{await salvar('tarefas',vis.tarefaId,{prazo:q,descricao:desc,...(status!=='agendada'?{status:'concluido',concluidoEm:agora}:{})})}catch(e){}}
      }
      const txt=nova?`Visita agendada para ${fmtQuando(q)} · ${LOCAIS[loc]} · ${end}${obs?' · '+obs:''}`
        :status==='realizada'?`Visita realizada (${fmtQuando(q)}) · ${LOCAIS[loc]}${obs?' · '+obs:''}`
        :status==='cancelada'?`Visita cancelada (${fmtQuando(q)})`
        :`Visita alterada para ${fmtQuando(q)} · ${LOCAIS[loc]} · ${end}`;
      const prox=proxima(l);
      const dados={visitas:l,visita:prox||vis,atualizadoEm:agora,historico:[...(atual.historico||[]),{tipo:'visita',txt,em:agora,por:S.myId}]};
      if(prox){dados.proximaAcao=`Visita ${prox.local==='loja'?'na nossa loja':'na academia'}`;dados.dataProxima=prox.quando}
      else if(/^Visita /.test(atual.proximaAcao||'')){dados.proximaAcao='';dados.dataProxima=null}
      if(nova&&(atual.etapa||'lead')!=='visita'&&(atual.etapa||'lead')!=='ganho')dados.etapa='visita';
      if(loc==='academia'&&!atual.endereco)dados.endereco=end;
      await salvar('clientes',id,dados);
      if(loc==='loja'&&end!==cfgLoja().endereco){try{await S.db.doc('config/loja').set({...cfgLoja(),endereco:end,atualizadoEm:agora})}catch(e){}}
      toast(nova?'Visita agendada':status==='realizada'?'Visita marcada como realizada':status==='cancelada'?'Visita cancelada':'Visita alterada');
      // nova visita: já oferece a mensagem de pós-agendamento no WhatsApp
      if(nova){const cc=cli(id)||atual,num=(cc.telefone&&!cc.semWhats)?1:(cc.telefone2&&!cc.semWhats2)?2:0;
        if(num&&window.DRAVEN_WAB)setTimeout(()=>DRAVEN_WAB.escolher(id,num,'visita_pos'),350);}
      return true;
    },{submitLabel:nova?'Agendar visita':'Salvar'});
    const box=document.getElementById('va-end');
    document.querySelectorAll('#dlgForm input[name=local]').forEach(r=>r.addEventListener('change',()=>{
      box.value=r.value==='loja'?(cfgLoja().endereco||''):endAcademia(cli(id)||c);
      box.placeholder=r.value==='loja'?'Endereço da loja (fica salvo para as próximas)':'Rua, número, bairro, cidade';
    }));
  }

  // levar o lead para "Visita agendada" abre a janela de agendamento
  const moverOriginal=window.moverEtapa;
  if(typeof moverOriginal==='function')window.moverEtapa=async function(id,etapa){
    const antes=(cli(id)||{}).etapa;
    await moverOriginal(id,etapa);
    const c=cli(id);
    if(etapa==='visita'&&antes!=='visita'&&c&&c.etapa==='visita'&&!visitasDe(c).some(v=>v.status==='agendada'&&v.quando>Date.now()))setTimeout(()=>agendar(id,'nova'),150);
  };

  document.addEventListener('click',e=>{
    const b=e.target.closest&&e.target.closest('[data-visita]');
    if(b){e.preventDefault();e.stopPropagation();agendar(b.dataset.visita,b.dataset.vid||'');return}
    // clicar em Ligar registra a ligação na linha do tempo
    const l=e.target.closest&&e.target.closest('a[data-ligcli]');
    if(l&&pode('crm')){const c=cli(l.dataset.ligcli);if(c){const agora=Date.now();
      salvar('clientes',c.id,{historico:[...(c.historico||[]),{tipo:'ligacao',txt:`Ligação para ${l.dataset.tel||c.telefone||''}`,em:agora,por:S.myId}],ultimaLigacaoEm:agora}).catch(()=>{})}}
  },true);

  // a "última ação" usa tempo relativo: atualiza a tela do funil a cada minuto
  setInterval(()=>{if(S.view==='crm'&&!document.querySelector('dialog[open]')&&typeof render==='function')render()},60000);

  return{agendar,visCard,uaCard,uaCol,camposFicha,lerFicha,ultimaAcao,visitasDe};
})();
</script>

<dialog id="wamsg" aria-labelledby="wamsg-t"><form method="dialog"></form></dialog>
<script>
window.DRAVEN_WAB=(function(){
  // mensagens prontas de fábrica; a gestão muda em Equipe e permissões > WhatsApp Business
  const PADRAO={
    geral:'Olá {contato}, tudo bem? Aqui é {vendedor}, da Draven Sports.',
    lead:'Olá {contato}, tudo bem? Aqui é {vendedor}, da Draven Sports. Fabricamos luvas, kimonos e equipamentos de luta, também com a marca de {nome}. Posso te mandar o nosso catálogo?',
    contato:'Olá {contato}! Segue o nosso catálogo: {catalogo}\nQual linha mais interessa para {nome}? Monto uma proposta sem compromisso.',
    visita_pos:'Combinado, {contato}! 🙌\n\nJá deixei agendado aqui para o dia {data}, às {hora}.\n\nUm pouquinho antes eu te chamo aqui só para confirmar, tá bom? Muito obrigada e um excelente trabalho por aí!',
    visita_conf:'Oi, {contato}, tudo bem?\n\nPassando para confirmar nosso encontro no dia {data}, às {hora}!\n\nContinua tudo certo por aí para a gente conversar sobre a parceria com a Draven Sports? 👍',
    visita_material:'Oi, {contato}, tudo certo?\n\nEstou montando o show-room que vou levar na nossa visita e queria confirmar com você: quais equipamentos ou acessórios você tem mais interesse em ver de perto?\n\nAssim já separo os modelos e cores ideais para o perfil dos seus alunos! 🥊',
    visita_sede:'Olá, {contato}, tudo bem? 🥰\n\nEstamos ansiosos para te receber em nossa sede!\n\n🗓️ Data e Horário: {data}, às {hora}\n\n📍 Endereço: {endereco_loja}\n\nPrecisando de qualquer suporte com o caminho, estou à disposição. Até breve! 😉',
    visita_externa:'Oi, {contato}, tudo bem?\n\nPassando para confirmar nossa visita na {nome} no dia {data}, às {hora}.\n\nVou levar nossa linha de produtos para você conhecer de perto a qualidade do nosso trabalho. Nos vemos em breve!',
    proposta:'Olá {contato}, tudo bem? Conseguiu ver a proposta que te enviei? Posso ajustar quantidades, cores ou prazo.',
    negociacao:'Olá {contato}! Consigo manter essa condição até {prazo}. Podemos fechar o pedido de {nome}?',
    ganho:'Olá {contato}, obrigado pela parceria! Quando precisar de reposição, é só chamar aqui.',
    perdido:'Olá {contato}, tudo bem? Chegaram novidades no nosso catálogo: {catalogo}\nVale uma olhada!'
  };
  const NOMES={geral:'Saudação',lead:'Novo lead',contato:'Primeiro contato (catálogo)',visita_pos:'1. Pós-agendamento (logo após marcar)',visita_conf:'2. Confirmação de agendamento',visita_material:'3. Confirmação de material para apresentação',visita_sede:'4. Visita à sede (cliente vem até a Draven)',visita_externa:'5. Visita externa (vamos até a academia)',proposta:'Proposta enviada',negociacao:'Negociação',ganho:'Cliente ativo',perdido:'Perdido (reativar)'};
  const VISITA=['visita_pos','visita_conf','visita_material','visita_sede','visita_externa'];
  const ORDEM=['geral','lead','contato',...VISITA,'proposta','negociacao','ganho','perdido'];
  const $w=s=>document.querySelector(s);
  const cfg=()=>((S.config||[]).find(x=>x.id==='whatsapp')||{});
  const soNum=t=>String(t||'').replace(/\D/g,'');
  function numeroEmpresa(){let d=soNum(cfg().numero);if(d&&d.length<=11)d='55'+d;return d}
  function catalogo(){const c=cfg();if(c.catalogo)return c.catalogo;const n=numeroEmpresa();return n?'https://wa.me/c/'+n:''}
  function modelo(k){const m=(cfg().modelos||{})[k];return m!=null&&String(m).trim()?m:PADRAO[k]}
  const proxSexta=()=>{const d=new Date();d.setDate(d.getDate()+((5-d.getDay()+7)%7||7));return d.toLocaleDateString('pt-BR')};
  const LOJA_PADRAO='Av. Álvaro Ramos, 2401 - Quarta Parada, São Paulo - SP';
  const enderecoLoja=()=>(((S.config||[]).find(x=>x.id==='loja')||{}).endereco)||LOJA_PADRAO;
  const dd=n=>String(n).padStart(2,'0');
  function preencher(txt,c){
    const vis=c.visita&&c.visita.quando?c.visita:null,q=vis?new Date(vis.quando):null;
    const v={contato:String(c.contato||'').trim().split(' ')[0],nome:c.nome||'',cidade:c.cidade||'',catalogo:catalogo()||'(peça o catálogo)',
      vendedor:String((S.me&&S.me.name)||'a equipe').split(' ')[0],empresa:'Draven Sports',prazo:proxSexta(),
      data:q?q.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'}):'[data]',
      hora:q?`${dd(q.getHours())}:${dd(q.getMinutes())}`:'[horário]',
      endereco:(vis&&vis.endereco)||'[endereço]',endereco_loja:enderecoLoja()};
    // sem nome do contato, tira a vírgula sobrando: "Oi, , tudo bem?" vira "Oi, tudo bem?"
    return String(txt||'').replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m).replace(/, ?(?=[,!?.])/g,'').replace(/ +(?=[,!?.])/g,'');
  }
  // qual modelo da visita abrir primeiro
  function modeloVisita(c){
    const v=c.visita;
    if(!v||!v.quando)return'visita_conf';
    if(v.agendadaEm&&Date.now()-v.agendadaEm<2*3600e3)return'visita_pos';
    return v.local==='loja'?'visita_sede':'visita_externa';
  }

  let atual=null;
  let atualTel='';
  function escolher(id,n,inicial){
    const c=typeof cli==='function'?cli(id):null;if(!c){return}
    atual=c;atualTel=n===2?c.telefone2:c.telefone;
    const etapa=inicial&&ORDEM.includes(inicial)?inicial:c.etapa==='visita'?modeloVisita(c):ORDEM.includes(c.etapa)?c.etapa:'geral';
    const atualEtapa=k=>k===etapa&&k!=='geral'&&!inicial;
    const ult=c.ultimoWhatsEm?`Último WhatsApp: ${fmtD(c.ultimoWhatsEm)}${c.ultimoWhatsPor?' por '+esc(pessoa(c.ultimoWhatsPor)):''}`:'Ainda sem WhatsApp registrado';
    const d=$w('#wamsg'),f=d.querySelector('form');
    f.innerHTML=`<div class="wm-h"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i><h2 id="wamsg-t">${esc(c.nome)}</h2><button type="button" class="btn ghost sm" data-wm="fechar" aria-label="Fechar">✕</button></div>
    <div class="wm-b">
      <div class="wm-info"><span><i class="fa-solid fa-phone"></i> ${esc(atualTel||'')}${n===2?' (telefone 2)':''}</span>${c.contato?`<span><i class="fa-solid fa-user"></i> ${esc(c.contato)}</span>`:''}<span>${etapaPill(c.etapa)}</span></div>
      <label class="f">Mensagem pronta<select class="inp" id="wm-mod">${(()=>{const op=k=>`<option value="${k}" ${k===etapa?'selected':''}>${esc(NOMES[k])}${atualEtapa(k)?' (sugerida)':''}</option>`;
        return ORDEM.filter(k=>!VISITA.includes(k)).slice(0,3).map(op).join('')+`<optgroup label="Visita agendada">${VISITA.map(op).join('')}</optgroup>`+ORDEM.filter(k=>!VISITA.includes(k)).slice(3).map(op).join('')})()}<option value="livre">Escrever do zero</option></select></label>
      <label class="f">Texto (pode editar antes de enviar)<textarea class="inp" id="wm-txt"></textarea></label>
      <p class="ro" style="margin:0">${ult}</p>
      ${numeroEmpresa()?'':'<p class="ro" style="margin:0">Dica: a gestão pode cadastrar o número e o catálogo do WhatsApp Business em Equipe e permissões.</p>'}
    </div>
    <div class="wm-f"><button type="button" class="btn" data-wm="fechar">Cancelar</button><button type="button" class="btn envia" data-wm="enviar"><i class="fa-brands fa-whatsapp"></i> Abrir no WhatsApp</button></div>`;
    const sel=f.querySelector('#wm-mod'),tx=f.querySelector('#wm-txt');
    const pinta=()=>{tx.value=sel.value==='livre'?'':preencher(modelo(sel.value),c)};
    sel.onchange=pinta;pinta();
    if(!d.open)d.showModal();
    setTimeout(()=>tx.focus(),30);
  }
  function enviar(){
    const c=atual;if(!c)return;
    const txt=$w('#wm-txt').value.trim(),mod=$w('#wm-mod').value;
    const url=waLink(atualTel||c.telefone,txt);
    $w('#wamsg').close();
    if(!url)return;
    // registra na linha do tempo do cliente: quem mandou, quando e qual mensagem
    if(typeof pode==='function'&&pode('crm')){
      const atualC=cli(c.id)||c;
      const h={tipo:'whatsapp',txt:`${mod==='livre'?'Mensagem livre':NOMES[mod]}: ${txt.slice(0,240)}${txt.length>240?'…':''}`,em:Date.now(),por:S.myId};
      salvar('clientes',c.id,{historico:[...(atualC.historico||[]),h],ultimoWhatsEm:h.em,ultimoWhatsPor:S.myId}).catch(()=>{});
    }
    // no computador: janela do WhatsApp Web ao lado; no celular: app do WhatsApp, sem sair do sistema
    if(window.DRAVEN_WA&&DRAVEN_WA.computador())DRAVEN_WA.abrir(url);
    else if(!window.open(url,'_blank'))location.href=url;
  }
  document.addEventListener('click',e=>{
    const b=e.target.closest&&e.target.closest('[data-wm]');if(!b)return;
    e.preventDefault();if(b.dataset.wm==='fechar')$w('#wamsg').close();else if(b.dataset.wm==='enviar')enviar();
  });

  // ---- configuração (gestão) ----
  function painel(){
    if(typeof papel!=='function'||papel()!=='gestao')return'';
    const c=cfg(),n=numeroEmpresa();
    return`<section class="panel"><div class="panel-h"><h2><i class="fa-brands fa-whatsapp" style="color:#16A34A"></i> WhatsApp Business</h2>${S.ro?'':'<button class="btn sm" data-wab="config"><i class="fa-solid fa-gear"></i> Configurar</button>'}</div>
     <div class="mini"><div><small>Número da empresa</small><b class="sm wab-num">${n?esc('+'+n):'Não cadastrado'}</b></div><div><small>Catálogo</small><b class="sm">${catalogo()?`<a href="${esc(catalogo())}" target="_blank" rel="noopener">Abrir</a>`:'—'}</b></div><div><small>Mensagens prontas</small><b class="sm">${ORDEM.length}${c.modelos?' (personalizadas)':''}</b></div></div>
     <p class="ro" style="margin:0"><b>Como a equipe usa o mesmo número:</b></p>
     <ol class="wab-passos">
      <li>No celular da empresa, abra o <b>WhatsApp Business</b> → ⋮ ou Configurações → <b>Aparelhos conectados</b> → <b>Conectar um aparelho</b>.</li>
      <li>Em cada computador da equipe, clique no botão <b>WhatsApp</b> no topo do sistema e leia o QR Code com esse celular.</li>
      <li>Pronto: todos atendem pelo número da empresa. O WhatsApp Business aceita até 4 aparelhos conectados além do celular (mais com o Meta Verified).</li>
     </ol>
     <p class="ro" style="margin:0">Ao clicar em WhatsApp num cliente, a pessoa escolhe a mensagem pronta da etapa do funil, ajusta o texto e envia. O envio fica na linha do tempo do cliente com o nome de quem mandou.</p>
    </section>`;
  }
  function configurar(){
    const c=cfg(),m=c.modelos||{};
    abrir('WhatsApp Business',`
     <div class="fg">
      <label class="f">Número do WhatsApp Business *<input class="inp" id="wab-num" name="numero" inputmode="tel" value="${esc(c.numero||'')}" placeholder="(11) 98578-0370"></label>
      <label class="f">Link do catálogo<input class="inp" id="wab-cat" name="catalogo" value="${esc(c.catalogo||'')}" placeholder="vazio = catálogo do WhatsApp (wa.me/c/…)"></label>
     </div>
     <p class="ro" style="margin:0">Nas mensagens você pode usar: {contato} (pessoa) {nome} (academia) {cidade} {catalogo} {vendedor} {prazo} e, na visita, {data} {hora} {endereco} {endereco_loja}. Deixe um campo vazio para voltar ao texto padrão.</p>
     ${ORDEM.map(k=>`<label class="f">${esc(NOMES[k])}<textarea class="inp" name="m_${k}" rows="3" placeholder="${esc(PADRAO[k])}">${esc(m[k]||'')}</textarea></label>`).join('')}
     <p class="err" id="v-err" hidden></p>`,
    async fd=>{
      const numero=String(fd.get('numero')||'').trim();
      if(numero&&soNum(numero).length<10){erro('#v-err','Confira o número: coloque o DDD.');return false}
      const modelos={};ORDEM.forEach(k=>{const v=String(fd.get('m_'+k)||'').trim();if(v)modelos[k]=v});
      try{await S.db.doc('config/whatsapp').set({numero,catalogo:String(fd.get('catalogo')||'').trim(),modelos,atualizadoEm:Date.now(),atualizadoPor:S.myId});toast('WhatsApp Business salvo');return true}
      catch(e){erro('#v-err','Não foi possível salvar.');return false}
    },{submitLabel:'Salvar'});
  }
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-wab="config"]');if(b){e.preventDefault();configurar()}});

  return{escolher,painel,numeroEmpresa,catalogo,enderecoLoja,LOJA_PADRAO};
})();
</script>
<!-- Sem barras de rolagem no sistema, exceto a barra lateral do Funil (layout original). No computador:
     - Tarefas e Pedidos cabem na largura da tela; o Funil tem colunas largas e rola para os lados;
     - o menu de abas quebra em duas linhas quando não cabe, em vez de rolar para o lado.
     Entra no index.html pelo ferramentas/montar.py. No celular o quadro continua deslizando com o dedo. -->
<style>
/* nenhuma barra de rolagem visível no sistema (página, funil, colunas, menus e janelas);
   rolar continua funcionando com a roda do mouse, o touchpad ou o dedo */
html,body,*{scrollbar-width:none!important;-ms-overflow-style:none!important}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;background:transparent!important}
@media (min-width:901px){
  /* Tarefas e Pedidos: colunas cabem na largura da tela */
  .board-wrap:has(> .board[style]){overflow:visible!important;padding-bottom:0!important}
  .board[style]{min-width:0!important;align-items:start}
  .board[style] .col,.board[style] .card{min-width:0}
  .board .col{max-height:none!important;overflow:visible!important}
  .nav{flex-wrap:wrap!important;overflow:visible!important;row-gap:4px}
  /* Funil: layout original, colunas largas com rolagem para os lados e a barra embaixo do quadro */
  .board-wrap:not(:has(> .board[style])){overflow-x:auto!important;overflow-y:hidden!important;scrollbar-width:auto!important;scrollbar-color:var(--accent) var(--surface-2)!important;padding-bottom:8px}
  .board-wrap:not(:has(> .board[style]))::-webkit-scrollbar{display:block!important;height:12px!important;width:auto!important;background:var(--surface-2)!important;border-radius:999px}
  .board-wrap:not(:has(> .board[style]))::-webkit-scrollbar-thumb{background:var(--accent);border-radius:999px;border:2px solid var(--surface-2)}
}

<!-- Produtos: preço de atacado e importação de produtos (catálogo Draven 2026 ou planilha CSV).
     Entra no index.html pelo ferramentas/montar.py, depois do sistema (usa S, salvar, abrir… do sistema). -->
<style>.tbl-wrap td.mono{white-space:nowrap}</style>
<script>
window.DRAVEN_PROD=(function(){
  const ALIAS={nome:['nome','produto','descricao','item'],variacao:['variacao','cor','cores','modelo'],sku:['sku','codigo','art','artigo','referencia','ref'],
    categoria:['categoria','linha','grupo'],unidade:['unidade','un','und'],precoAtacado:['preco atacado','atacado','valor atacado'],preco:['preco varejo','varejo','preco','valor','preco de venda'],
    custo:['custo','custo unitario'],estoque:['estoque','quantidade','qtd','saldo'],minimo:['minimo','estoque minimo'],ativo:['ativo','disponivel','situacao'],obs:['observacao','obs']};
  const chave=s=>norm(s).replace(/[^a-z0-9]+/g,' ').trim();
  const numBR=v=>{const t=String(v??'').replace(/[^\d,.-]/g,'');if(!t)return 0;const n=Number(t.includes(',')?t.replace(/\./g,'').replace(',','.'):t);return isFinite(n)?n:0};
  const sim=v=>!/^(nao|não|n|0|false|inativo|indisponivel|indisponível)$/i.test(String(v??'').trim()||'sim');

  function lerCsv(txt){
    const linhas=String(txt||'').replace(/^﻿/,'').replace(/\r/g,'').split('\n').filter(l=>l.trim());
    if(linhas.length<2)return{erro:'Cole o cabeçalho e pelo menos uma linha de produto.'};
    const sep=linhas[0].includes('\t')?'\t':(linhas[0].split(';').length>linhas[0].split(',').length?';':',');
    const parse=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===sep&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(x=>x.trim())};
    const cab=parse(linhas[0]).map(chave),map={};
    // primeiro os nomes de coluna mais específicos (ex.: "preço atacado" antes de "preço")
    const ordem=['precoAtacado','preco','custo','minimo','estoque','sku','variacao','categoria','unidade','ativo','obs','nome'];
    for(const k of ordem){const i=cab.findIndex((h,ix)=>!Object.values(map).includes(ix)&&ALIAS[k].some(a=>h===chave(a)||h.startsWith(chave(a)+' ')));if(i>=0)map[k]=i}
    if(map.nome==null)return{erro:'Não encontrei a coluna de nome do produto ("Nome" ou "Produto").'};
    const rows=linhas.slice(1).map(parse).map(r=>{const o={};for(const[k,i]of Object.entries(map))o[k]=r[i]??'';return o}).filter(o=>String(o.nome).trim());
    return{rows,cols:Object.keys(map)};
  }
  function categoria(c){const n=chave(c);return CATS.find(x=>chave(x)===n)||(c?'Outro':'Outro')}

  let IMPP=null;
  function preparar(rows){
    const porSku=new Map(S.produtos.filter(p=>p.sku).map(p=>[chave(p.sku),p]));
    const porNome=new Map(S.produtos.map(p=>[chave(p.nome+' '+(p.variacao||'')),p]));
    const novos=[],atualiza=[],iguais=[];
    for(const r of rows){
      const d={nome:String(r.nome).trim(),variacao:String(r.variacao||'').trim(),sku:String(r.sku||'').trim().toUpperCase(),categoria:categoria(r.categoria),unidade:String(r.unidade||'un').trim()||'un',
        preco:numBR(r.preco),precoAtacado:numBR(r.precoAtacado),ativo:r.ativo==null||r.ativo===''?true:sim(r.ativo),obs:String(r.obs||'').trim()};
      if(r.custo!=null&&r.custo!=='')d.custo=numBR(r.custo);
      if(r.minimo!=null&&r.minimo!=='')d.minimo=numBR(r.minimo);
      const ini=r.estoque!=null&&r.estoque!==''?numBR(r.estoque):0;
      const p=(d.sku&&porSku.get(chave(d.sku)))||porNome.get(chave(d.nome+' '+d.variacao));
      if(!p){novos.push({d,ini});continue}
      const muda={};for(const k of['nome','variacao','sku','categoria','unidade','preco','precoAtacado','ativo','custo','minimo'])if(k in d&&d[k]!==''&&d[k]!==p[k])muda[k]=d[k];
      if(d.obs&&d.obs!==p.obs)muda.obs=d.obs;
      Object.keys(muda).length?atualiza.push({p,muda}):iguais.push(p);
    }
    return{novos,atualiza,iguais};
  }
  function previa(txt){
    const box=document.getElementById('ip-prev');if(!box)return;
    const r=lerCsv(txt);
    if(r.erro){IMPP=null;box.innerHTML=String(txt||'').trim()?`<p class="err">${esc(r.erro)}</p>`:'';return}
    const p=preparar(r.rows);IMPP=p;
    const inat=p.novos.filter(x=>!x.d.ativo).length;
    box.innerHTML=`<div class="notice"><b>${p.novos.length}</b> produto${p.novos.length===1?'':'s'} novo${p.novos.length===1?'':'s'}${inat?` (${inat} marcado${inat===1?'':'s'} como indisponível)`:''}${p.atualiza.length?` · <b>${p.atualiza.length}</b> já cadastrado${p.atualiza.length===1?'':'s'} com preço ou dado atualizado`:''}${p.iguais.length?` · ${p.iguais.length} já ${p.iguais.length===1?'está igual':'estão iguais'}`:''}. O estoque atual dos produtos já cadastrados não muda.</div>
    ${p.novos.length||p.atualiza.length?`<div class="tbl-wrap" style="max-height:280px;overflow:auto"><table style="min-width:640px"><thead><tr><th>SKU</th><th>Produto</th><th>Categoria</th><th class="num">Atacado</th><th class="num">Varejo</th><th>Situação</th></tr></thead><tbody>
    ${[...p.novos.map(x=>[x.d,'Novo'+(x.d.ativo?'':' · indisponível')]),...p.atualiza.map(x=>[{...x.p,...x.muda},'Atualiza: '+Object.keys(x.muda).map(k=>({preco:'varejo',precoAtacado:'atacado'}[k]||k)).join(', ')])].slice(0,80).map(([d,s])=>`<tr><td class="mono">${esc(d.sku||'—')}</td><td>${esc(d.nome)}${d.variacao?`<div class="ro">${esc(d.variacao)}</div>`:''}</td><td>${esc(d.categoria)}</td><td class="num">${d.precoAtacado?money(d.precoAtacado):'—'}</td><td class="num">${d.preco?money(d.preco):(d.obs||'—')}</td><td>${esc(s)}</td></tr>`).join('')}
    </tbody></table></div>`:''}`;
  }
  function formImportar(){
    IMPP=null;
    abrir('Importar produtos',`
     <p class="sub" style="margin:0">Carregue o <b>catálogo Draven 2026</b> (60 itens: Angry, The Mist preta e vermelha, Shark, The Eagle, treino, bolsas e luvas de goleiro, com preço de atacado e varejo) ou uma planilha CSV sua. Produtos com o mesmo SKU (Art.) não são duplicados: só têm preço e dados atualizados.</p>
     <div class="tools"><button type="button" class="btn pri" id="ip-cat"><i class="fa-solid fa-book-open"></i> Usar o catálogo Draven 2026</button></div>
     <label class="f">Ou arquivo CSV<input class="inp" id="ip-arq" type="file" accept=".csv,.txt,text/csv"></label>
     <label class="f">Ou cole aqui<textarea class="inp mono" id="ip-txt" rows="5" placeholder="Nome;Variação;SKU;Categoria;Unidade;Preço atacado;Preço varejo;Estoque"></textarea></label>
     <div id="ip-prev"></div><p class="err" id="v-err" hidden></p>`,
    async()=>{
      if(!IMPP||(!IMPP.novos.length&&!IMPP.atualiza.length)){erro('#v-err','Nenhum produto novo ou alterado para importar.');return false}
      const btn=document.querySelector('#dlgForm button[type=submit]'),agora=Date.now(),total=IMPP.novos.length+IMPP.atualiza.length;let n=0;
      for(const{d,ini}of IMPP.novos){
        const dados={...d,minimo:d.minimo||0,estoque:0,criadoEm:agora,atualizadoEm:agora,criadoPor:S.myId,origem:'Importação de produtos'};
        if(!dados.obs)delete dados.obs;
        const id=await salvar('produtos',null,dados);
        if(ini){S.produtos.push({id,...dados});try{await moverEstoque(id,ini,'inicial','Importação','')}catch(e){}}
        n++;if(n%10===0)btn.textContent=`Importando ${n}/${total}…`;
      }
      for(const{p,muda}of IMPP.atualiza){await salvar('produtos',p.id,{...muda,atualizadoEm:agora});n++;if(n%10===0)btn.textContent=`Importando ${n}/${total}…`}
      toast(`${IMPP.novos.length} produto${IMPP.novos.length===1?'':'s'} cadastrado${IMPP.novos.length===1?'':'s'}${IMPP.atualiza.length?` · ${IMPP.atualiza.length} atualizado${IMPP.atualiza.length===1?'':'s'}`:''}`);
      return true;
    },{submitLabel:'Importar produtos'});
    const txt=document.getElementById('ip-txt');
    txt.addEventListener('input',()=>previa(txt.value));
    document.getElementById('ip-arq').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{txt.value=fr.result;previa(fr.result)};fr.readAsText(f)});
    document.getElementById('ip-cat').addEventListener('click',async e=>{
      e.target.disabled=true;
      try{const r=await fetch('catalogo-2026.csv',{cache:'no-cache'});if(!r.ok)throw 0;txt.value=await r.text();previa(txt.value)}
      catch(x){erro('#v-err','Não consegui carregar o catálogo. Recarregue a página e tente de novo.')}
      finally{e.target.disabled=false}
    });
  }
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-a="importar-produtos"]');if(b){e.preventDefault();e.stopPropagation();formImportar()}},true);
  return{formImportar,lerCsv,preparar};
})();
</script>

  /* quadros Kanban: uma coluna por vez, com encaixe ao rolar */

  .board,.board[style]{grid-template-columns:none!important;grid-auto-flow:column;grid-auto-columns:min(84vw,320px);min-width:0!important;width:max-content;gap:10px}

  /* textos e botões que não cabiam */
  .kpi .btn,.kpi span{white-space:normal}
  .kpi b{font-size:26px}

  /* o iPhone não dá zoom ao tocar em campos de 16px */

  #dvsync{bottom:calc(72px + env(safe-area-inset-bottom,0px))}

}

@media (max-width:620px){
  /* janela de ficha, pedido etc. ocupa a tela toda */
